/* ---- Vista del informe: pantalla limpia, pensada para salir en PDF ---- */
function viewInforme() {
  const from = INFORME.from, to = INFORME.to;
  const ses = sesionesPlan(from, to);
  const P = SEED.perfil;
  const rango = weekRange(from).split("–")[0].trim() + " → " + weekRange(to).split("–").pop().trim();

  let h = `<div class="rep">
    <div class="rep-head">
      <p class="rep-eyebrow">Preparación física · pádel · Plan Prevención</p>
      <h1>Informe de entrenamiento</h1>
      <p class="rep-sub"><b>Mauro Fernández</b> para <b>Prof. Martín Ferreras</b><br>
        ${from === to ? "Semana " + from : "Semanas " + from + " a " + to} · ${esc(rango)} · emitido el ${esc(hoy())}</p>
    </div>`;

  // --- adherencia ---
  const filas = [];
  let hechas = 0, plan = 0;
  for (let n = from; n <= to; n++) {
    const tot = routineFor(n).dias.length, hh = sesionesHechas(n);
    hechas += hh; plan += tot;
    filas.push({ l: "Sem " + n, v: hh, tot });
  }
  h += `<section class="rep-sec">
    <h2>Adherencia</h2>
    <p class="rep-kpis">
      <span class="rk"><b>${hechas}/${plan}</b><span>sesiones completadas</span></span>
      <span class="rk"><b>${plan ? Math.round(100 * hechas / plan) : 0}%</b><span>del plan</span></span>
      <span class="rk"><b>${ses.length}</b><span>días con registro</span></span>
    </p>

  // --- rodilla: el criterio de progresión de Martín ---
  const dolor = ses.filter(x => x.ev && x.ev.dolor24 != null).map(x => ({ f: x.fecha, v: x.ev.dolor24 }));
  const rpe = ses.filter(x => x.ev && x.ev.rpe).map(x => ({ f: x.fecha, v: x.ev.rpe }));
  const picos = dolor.filter(d => d.v >= 4).length;
  h += `<section class="rep-sec">
    <h2>Rodilla — dolor a las 24 h</h2>
    ${dolor.length ? `${lineChart(dolor, { max: 10, corte: 4, corteTxt: "umbral 4", cls: "clay", label: "Dolor 24 h" })}

    <h2>Esfuerzo percibido (RPE)</h2>
    ${rpe.length ? lineChart(rpe, { max: 10, cls: "green", label: "RPE" })

  </section>`;

  // --- tonelaje ---
  const ton = [];
  for (let n = from; n <= to; n++) ton.push({ l: "Sem " + n, v: tonelajeSemana(n) });
  if (ton.some(t => t.v > 0)) {

    h += `<div class="rep-ses">

        if (conP.length) {

          });
          o += `<p class="rs-regs carga">${porEx.map(y => esc(y.nombre) + " <b>" + y.v.map(esc).join(" · ") + " kg</b>").join("<br>")}</p>`;

  // --- cuerpo ---
  const ib = P.inbody[P.inbody.length - 1];
  const bl = S.bodyLog.filter(b => num(b.peso) !== null);
  const blRango = bl.filter(b => { for (let n = from; n <= to; n++) if (enSemana(n, b.fecha)) return true; return false; });

    ${blRango.length ? "" : `<p class="rep-note muted" style="margin:0 0 10px"><b>Sin novedades en este período:</b> no hubo pesajes nuevos ni InBody nuevo. Los valores de abajo son los últimos registrados.</p>`}
    <p class="rep-kpis">
      <span class="rk"><b>${bl.length ? esc(bl[bl.length - 1].peso) + " kg" : ib.peso + " kg"}</b><span>${bl.length ? "peso · " + esc(bl[bl.length - 1].fecha) : "InBody " + esc(ib.fecha)}</span></span>

  h += `<p class="rep-foot">Generado desde la app del plan · ${esc(hoy())}</p></div>`;

}

/* ---- Resúmenes ---- */
function logsFor(exo) { return S.logs[exo.id] || []; }
function evalLine(dk) {
  return sesFechas(S.evals, dk).map(f => {
    const t = evalResumenTxt(S.evals[sesKey(dk, f)]);
    return t ? "  📋 " + f + " — " + t + "\n" : "";
  }).join("");
}
function buildWeekResumen(n) {
  const w = SEED.semanas[n - 1];
  const r = S.routines[n];
  let t = "🎾 Semana " + n + " (" + weekRange(n) + ") — " + w.objetivo + " (" + w.bloque + ")\n";
  if (r && r.dias) {
    r.dias.forEach((d, i) => {
      const dk = n + "-" + i;
      const lines = [];
      d.secciones.forEach(s => s.ejercicios.forEach(exo => {
        const l = logsFor(exo);
        if (l.length) lines.push("  • " + exo.nombre + (exo.esquema ? " (" + exo.esquema + ")" : "") + ": " +
          l.map(x => fmtLog(x)).join(" → "));
      }));
      const notas = sesFechas(S.dayNotes, dk)
        .filter(f => (S.dayNotes[sesKey(dk, f)] || "").trim())
        .map(f => "  📝 " + f + " — " + S.dayNotes[sesKey(dk, f)].trim() + "\n").join("");
      const evs = evalLine(dk);
      if (lines.length || S.dayDone[dk] || evs || notas) {
        t += "\n" + d.nombre + (S.dayDone[dk] ? " ✓" : "") + "\n" + evs +
          notas + lines.join("\n") + (lines.length ? "\n" : "");
      }
    });
  }
  const cs = S.comments.filter(c => String(c.semana) === String(n));
  if (cs.length) { t += "\n💬 Comentarios:\n"; cs.forEach(c => { t += "  [" + c.quien + "] " + c.texto + "\n"; }); }
  const lb = S.bodyLog.length ? S.bodyLog[S.bodyLog.length - 1] : null;
  if (lb) t += "\n⚖️ Peso corporal: " + lb.peso + " (" + lb.fecha + ")\n";
  return t;
}
function buildResumen() {
  const done = Object.keys(S.weekDone).filter(k => S.weekDone[k]).sort((a, b) => a - b);
  let md = "🎾 Progreso — Plan pádel (Mauro)\n\n";
  md += "Semanas completadas: " + (done.length ? done.join(", ") : "ninguna todavía") + " (" + done.length + "/12)\n";
  md += "Entrenos hechos: " + Object.values(S.dayDone).filter(Boolean).length + "\n";
  let any = false;
  walkAll((exo, ctx) => {
    const l = logsFor(exo);
    if (!l.length || exo.sinPeso) return;
    if (!any) { md += "\nRegistros de peso:\n"; any = true; }
    md += "• " + exo.nombre + " (" + ctx + (exo.esquema ? " · " + exo.esquema : "") + "): " +
      l.map(r => fmtLog(r) + " el " + r.fecha).join(" → ") + "\n";
  });
  if (S.bodyLog.length) {
    md += "\nPeso corporal:\n";
    S.bodyLog.forEach(b => { md += "• " + b.fecha + ": " + b.peso + (b.nota ? " (" + b.nota + ")" : "") + "\n"; });
  }
  const notes = Object.entries(S.dayNotes || {}).filter(([, v]) => v && String(v).trim());
  if (notes.length) {
    md += "\nNotas por día:\n";
    notes.forEach(([k, v]) => {
      const at = String(k).split("@"), p = at[0].split("-");
      md += "• Semana " + p[0] + " · día " + (parseInt(p[1], 10) + 1) +
        (at[1] ? " · " + at[1] : "") + ": " + String(v).trim() + "\n";
    });
  }
  const evKeys = Object.keys(S.evals || {}).filter(k => evalResumenTxt(S.evals[k]));
  if (evKeys.length) {
    md += "\nEvaluaciones por sesión:\n";
    evKeys.sort((a, b) => {
      const fa = String(a).split("@")[1] || "", fb = String(b).split("@")[1] || "";
      return fechaOrd(fa) - fechaOrd(fb);
    }).forEach(k => {
      const at = String(k).split("@"), p = at[0].split("-");
      md += "• Semana " + p[0] + " · día " + (parseInt(p[1], 10) + 1) +
        (at[1] ? " · " + at[1] : "") + ": " + evalResumenTxt(S.evals[k]) + "\n";
    });
  }
  if (S.comments.length) {
    md += "\nComentarios:\n";
    S.comments.forEach(c => { md += "• [" + c.quien + " · " + c.fecha + (c.semana ? " · Sem " + c.semana : "") + "] " + c.texto + "\n"; });
  }
  return md;
}

/* El informe a PNG: se serializa el nodo como XHTML dentro de un <foreignObject>.
   Las fuentes del CSS ya son data: URIs, así que no hay recursos externos y el
   canvas no queda contaminado. Las variables viven en :root, que dentro del SVG
   no aplica: se reescriben sobre el contenedor. */
async function informeCanvas(escala) {
  const rep = document.querySelector(".rep");
  if (!rep) throw new Error("sin informe");
  const w = 800;
  const css = Array.from(document.querySelectorAll("style")).map(x => x.textContent)
    .join("\n").split(":root").join(".repwrap")
    .replace(/--sans:[^;]+;/, '--sans: Helvetica, "Helvetica Neue", Arial, sans-serif;');
  const clon = rep.cloneNode(true);
  const xml = new XMLSerializer().serializeToString(clon);
  const alto = Math.ceil(rep.getBoundingClientRect().height *
    (w - 32) / rep.getBoundingClientRect().width) + 40;
  const doc =
    '<div xmlns="http://www.w3.org/1999/xhtml" class="repwrap" style="width:' + w +
    'px;padding:16px;box-sizing:border-box;background:#F4EBDD">' +
    "<style>" + css.replace(/]]>/g, "]]&gt;") + "</style>" + xml + "</div>";
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + alto +
    '"><foreignObject x="0" y="0" width="100%" height="100%">' + doc + "</foreignObject></svg>";
  const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  const img = new Image();
  await new Promise((res, rej) => {
    img.onload = res;
    img.onerror = () => rej(new Error("no se pudo dibujar"));
    img.src = url;
  });
  if (alto > 12000) throw new Error("informe demasiado largo — elegí menos semanas");
  const k = Math.max(1, Math.min(escala || 2, 12000 / alto));
  const cv = document.createElement("canvas");
  cv.width = Math.round(w * k); cv.height = Math.round(alto * k);
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#F4EBDD";
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.drawImage(img, 0, 0, cv.width, cv.height);
  return cv;
}
window.bajarInformeImagen = async () => {
  const m = $("#repmsg");
  if (m) m.textContent = "Armando la imagen…";
  try {
    const cv = await informeCanvas(2);
    const blob = await new Promise(r => cv.toBlob(r, "image/png"));
    if (!blob) throw new Error("canvas vacío");
    const nombre = "informe-padel-sem" + INFORME.from + (INFORME.to !== INFORME.from ? "-" + INFORME.to : "") + ".png";
    if (window.claude && window.claude.downloads) {
      await window.claude.downloads.save({ filename: nombre, data: blob });
      if (m) m.textContent = "Imagen guardada ✓ — mandásela a Martín por WhatsApp.";
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = nombre; a.click();
      if (m) m.textContent = "Imagen generada ✓";
    }
  } catch (e) {
    if (m) m.textContent = "No se pudo generar la imagen (" + ((e && (e.code || e.message)) || "error") + "). Probá con el informe en texto.";
  }
};
/* Versión en texto: siempre funciona y Martín la puede pegar donde quiera */
window.bajarInformeTexto = async () => {
  const m = $("#repmsg");
  const data = textoInforme();
  const nombre = "informe-padel-sem" + INFORME.from + (INFORME.to !== INFORME.from ? "-" + INFORME.to : "") + ".md";
  if (window.claude && window.claude.downloads) {
    try {
      await window.claude.downloads.save({ filename: nombre, data });
      if (m) m.textContent = "Archivo guardado ✓";
      return;
    } catch (e) { if (m) m.textContent = "No se pudo descargar (" + (e && e.code ? e.code : "error") + ")."; return; }
  }
  try { await navigator.clipboard.writeText(data); if (m) m.textContent = "Informe copiado ✓"; }
  catch (e) { if (m) m.textContent = "No se pudo copiar en este entorno."; }
};
window.exportResumen = () => offer("progreso-padel.md", buildResumen());
function backupObj() {
  /* Las rutinas son el 97% del peso y casi siempre son una copia del plan que la app
     ya trae. Solo viajan las semanas que se editaron a mano. */
  const R = {};
  Object.keys(S.routines || {}).forEach(n => {
    const seed = SEED.semanas[n - 1];
    if (!seed || !seed.dias) { R[n] = S.routines[n]; return; }
    if (JSON.stringify(S.routines[n].dias) !== JSON.stringify(seed.dias)) R[n] = S.routines[n];
  });
  return {
  planV: S.planV, weekDone: S.weekDone, dayDone: S.dayDone, secDone: S.secDone, routines: R, compPick: S.compPick,
    weekNotes: S.weekNotes, dayNotes: S.dayNotes, logs: S.logs, evals: S.evals, comments: S.comments, bodyLog: S.bodyLog, seq: S.seq };
}
window.exportBackup = () => {
  S.lastBackupTs = Date.now(); save();
  return offer("backup-plan-padel.json", JSON.stringify(backupObj(), null, 2));
};
window.copiarBackup = async () => {
  const msg = $("#expmsg");
  const data = JSON.stringify(backupObj());
  try {
    await navigator.clipboard.writeText(data);
    S.lastBackupTs = Date.now(); save();
    if (msg) msg.textContent = "Backup copiado ✓ (" + Math.round(data.length / 1024) + " KB) — pegalo en Importar en el otro dispositivo.";
  } catch (e) {
    IMPOPEN = true; render();
    const b = $("#impbox");
    if (b) { b.value = data; b.select(); }
    const m2 = $("#expmsg");
    if (m2) m2.textContent = "No se pudo copiar solo: está seleccionado abajo, copialo a mano.";
  }
};
window.toggleImport = () => { IMPOPEN = !IMPOPEN; render(); };
window.doImport = () => {
  const msg = $("#expmsg");
  const box = $("#impbox");
  if (!box) { if (msg) msg.textContent = "No hay nada para importar."; return false; }
  try {
    const d = JSON.parse(box.value);
    const ok = aplicarImport(d);
    if (msg) msg.textContent = ok ? "Backup importado ✓" : "El JSON pegado no es válido.";
    return ok;
  } catch (e) { if (msg) msg.textContent = "El JSON pegado no es válido."; return false; }
};
/* La importación de verdad: trabaja sobre el objeto, sin depender de que haya un
   textarea en pantalla (el link de importación no pasa por el DOM). */
function aplicarImport(d) {
  try {
    if (!d || typeof d !== "object" || Array.isArray(d)) throw new Error("shape");
    // Backup de versiones viejas: migrar logs y descartar rutinas obsoletas
    if (!d.planV) {
      d.logs = d.logs && typeof d.logs === "object" ? d.logs : {};
      migrateV1(d);
    }
    if ((d.planV || 0) < 3) delete d.routines;
    if ((d.planV || 0) < 4) { delete d.routines; delete d.weekDone; delete d.dayDone; delete d.secDone; delete d.evals; delete d.compPick; }
    if ((d.planV || 0) < 7) migrateV7(d);
    if ((d.planV || 0) < 8) migrateV8(d);
    if ((d.planV || 0) < 9) migrateV9(d);
    if ((d.planV || 0) < 10) migrateV10(d);
    if ((d.planV || 0) < 6 && d.weekNotes) {
      d.dayNotes = d.dayNotes || {};
      Object.entries(d.weekNotes).forEach(([n, v]) => { if (v && String(v).trim()) d.dayNotes[n + "-0"] = String(v).trim(); });
      d.weekNotes = {};
    }
    ["weekDone", "dayDone", "secDone", "routines", "compPick", "weekNotes", "dayNotes", "logs", "evals"].forEach(k => {
      if (d[k] && typeof d[k] === "object" && !Array.isArray(d[k])) S[k] = d[k];
    });
    if (Array.isArray(d.comments)) S.comments = d.comments;
    if (Array.isArray(d.bodyLog)) S.bodyLog = d.bodyLog;
    if (typeof d.seq === "number") S.seq = Math.max(S.seq, d.seq);
    Object.keys(S.routines).forEach(k => {
      if (Array.isArray(S.routines[k])) {
        const dias = [{ nombre: "Día 1", secciones: S.routines[k] }];
        while (dias.length < 3) dias.push(emptyDay("Día " + (dias.length + 1)));
        S.routines[k] = { dias };
      }
    });
    EXCACHE = null;
    save(); render();
    return true;
  } catch (e) { return false; }
}

render();

/* Si la URL trae un informe compartido, se abre en modo solo lectura sobre un estado
   aparte: lo que el visitante tenga guardado no se lee ni se pisa. */
async function abrirCompartido() {
  const h = String(location.hash || "");
  if (h === "#informe") {
    try { await abrirPublicado(); }
    catch (e) {
      document.getElementById("app").innerHTML =
        '<div class="rep-bar"><span class="rep-bar-t">Informe</span></div>' +
        '<div class="rep-shared">Todavía no hay un informe publicado en esta dirección.</div>';
    }
    return;
  }
  if (h.indexOf("#r=") !== 0 && h.indexOf("#i=") !== 0) return;
  try {
    const d = await descomprimir(h.slice(3));
    if (h.indexOf("#i=") === 0) {           // link de importación: pide confirmación
      PENDIMPORT = d.bk || d;
      render();
      window.scrollTo(0, 0);
      return;
    }
    aplicarCompartido(d);
    INFORME = { from: d.f || 1, to: d.t || 12 };
    render();
    window.scrollTo(0, 0);
  } catch (e) {
    document.getElementById("app").innerHTML =
      '<div class="rep-bar"><span class="rep-bar-t">Informe compartido</span></div>' +
      '<div class="rep-shared">No se pudo leer este link — puede haberse cortado al copiarlo. Pedile a Mauro que te lo mande de nuevo.</div>';
  }
}
abrirCompartido();
// pegar el link en una pestaña ya abierta solo cambia el hash: el script no se re-ejecuta
window.addEventListener("hashchange", () => {
  const h = String(location.hash || "");
  if (h.indexOf("#r=") === 0 || h.indexOf("#i=") === 0 || h === "#informe") location.reload();
});
/* ¿Hay datos publicados? Solo para ofrecer el link corto; si no, no pasa nada. */
fetch("datos.json", { method: "HEAD" }).then(r => { if (r.ok) { PUBLICADO = true; if (!INFORME && !PENDIMPORT) render(); } }).catch(() => {});
</script>
