  /* Tema único: club claro. Crema protagonista, verdes de acento (pedido de Mauro). */
  :root {
    --bg: #F4EBDD; --surface: #F9F3E4; --surface-2: #EEE1C8;
    --ink: #26332B; --muted: #5F6D5D; --line: #D8C7A6; --line-soft: #E6DCC5;
    --green: #3E5F4D; --green-hi: #4C7460; --green-soft: #6F8F7B; --sage: #AFC8B4; --on-green: #F4EBDD;
    --clay: #A9552F; --gold: #97772A; --slate: #33667A;
    --gold-bg: #EDE0C0; --wa: #1FA855;
    --shadow: 0 1px 2px rgba(62,95,77,.10), 0 8px 20px rgba(62,95,77,.08);
    --raise: inset 0 1px 0 rgba(255,255,255,.55);
    --display: "Archivo Black", "Arial Black", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; overflow-x: hidden; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.5;
  }
  #app { max-width: 620px; margin: 0 auto; padding: 0 16px calc(88px + env(safe-area-inset-bottom)); }

  .masthead { text-align: center; padding: 26px 0 12px; }
  .masthead .eyebrow {
    font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: .2em;
    text-transform: uppercase; color: var(--green); margin: 0 0 10px;
  }
  .masthead h1 {
    font-family: var(--display); font-weight: 400; font-size: 21px; letter-spacing: -.01em;
    text-transform: uppercase; margin: 0; line-height: 1.15; text-wrap: balance;
  }
  .masthead .sub { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  .rule { border: 0; border-top: 3px double var(--line); margin: 14px auto 0; }

  .card {
    background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px;
    padding: 15px 17px; margin-bottom: 12px; box-shadow: var(--shadow), var(--raise);
  }
  .card h2 {
    font-family: var(--display); font-weight: 400; font-size: 12.5px; letter-spacing: .02em;
    text-transform: uppercase; margin: 0 0 8px;
  }
  .card p { margin: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .wdate { font-family: var(--mono); font-size: 10.5px; color: var(--muted); letter-spacing: .04em; }

  .continue {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; cursor: pointer;
    background: var(--surface); color: var(--ink); border: 1px solid var(--line-soft);
    border-left: 4px solid var(--green); border-radius: 12px;
    padding: 16px 18px; margin: 16px 0 10px; font-family: inherit; box-shadow: var(--shadow), var(--raise);
  }
  .continue .big { font-family: var(--display); font-size: 14px; text-transform: uppercase; letter-spacing: .01em; color: var(--green); }
  .continue .sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .continue .arrow {
    margin-left: auto; flex: none; width: 40px; height: 40px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center; font-size: 19px;
    background: linear-gradient(180deg, var(--green-hi), var(--green)); color: var(--on-green);
    box-shadow: 0 2px 6px rgba(62,95,77,.35);
  }
  .continue.cal { border-left-color: var(--gold); margin: 0 0 18px; }
  .continue.cal .big { color: var(--gold); }
  .continue.cal .arrow { background: linear-gradient(180deg, #A98A3B, var(--gold)); }

  .meso-head { display: flex; align-items: baseline; gap: 10px; margin: 24px 2px 3px; }
  .meso-head h2 { font-family: var(--display); font-weight: 400; font-size: 15px; text-transform: uppercase; margin: 0; }
  .meso-head .range { font-family: var(--mono); color: var(--muted); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
  .meso-obj { margin: 3px 2px 12px; color: var(--muted); font-size: 13px; }

  .week-row {
    display: flex; align-items: center; gap: 13px; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px;
    padding: 13px 15px; margin-bottom: 9px; cursor: pointer; font-family: inherit; font-size: inherit;
    color: inherit; box-shadow: var(--shadow), var(--raise); min-height: 64px;
  }
  .week-row.cur { border-color: var(--green-soft); }
  .week-row .wnum {
    flex: none; width: 42px; height: 42px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--display); font-size: 17px; color: var(--green);
    background: linear-gradient(180deg, #E9F0E7, #D5E3D6);
    box-shadow: inset 0 1px 2px rgba(62,95,77,.18), 0 1px 0 rgba(255,255,255,.6);
  }
  .week-row .winfo { flex: 1; min-width: 0; }
  .week-row .wtitle { font-weight: 650; font-size: 14.5px; display: block; }
  .week-row .wsub { color: var(--muted); font-size: 12px; margin-top: 1px; display: block; }
  .week-row .wchips { display: flex; flex-wrap: wrap; gap: 5px 8px; align-items: center; margin-top: 8px; }

  .chip {
    display: inline-block; font-family: var(--mono); font-size: 9.5px; font-weight: 500;
    letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px;
    background: var(--surface-2);
    background: color-mix(in srgb, var(--phase, var(--muted)) 13%, transparent);
    color: var(--phase, var(--muted));
  }
  .chip.torneo { background: var(--gold-bg); color: var(--gold); }
  .chip.cur { background: var(--green); color: var(--on-green); }
  .meter {
    display: inline-flex; align-items: center; gap: 4px;
    font-family: var(--mono); font-size: 10px; letter-spacing: .02em; color: var(--muted);
  }
  .meter b { font-weight: 500; letter-spacing: 2px; font-size: 9px; }
  .meter { white-space: nowrap; }
  .wk-header p { flex-wrap: wrap; }
  .meter.vol b { color: var(--green-soft); }
  .meter.int b { color: var(--clay); }
  .tick {
    width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px; color: transparent; flex: none;
  }
  .tick.done { background: linear-gradient(180deg, var(--green-hi), var(--green)); border-color: var(--green); color: var(--on-green); }

  .wk-header {
    border-top: 4px solid var(--phase, var(--green));
    background: var(--surface);
    background: linear-gradient(180deg, color-mix(in srgb, var(--sage) 22%, var(--surface)), var(--surface) 75%);
    border-color: color-mix(in srgb, var(--green-soft) 30%, var(--line-soft));
    border-top-color: var(--phase, var(--green));
    box-shadow: 0 2px 4px rgba(62,95,77,.12), 0 12px 26px rgba(62,95,77,.12), var(--raise);
  }
  .wk-header .toprow { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .wk-header .toprow > div:first-child { min-width: 0; flex: 1 1 auto; }
  .wk-header h2 { font-size: 17px; margin-top: 8px; letter-spacing: 0; }
  .wk-nav { display: flex; gap: 6px; flex: 0 0 auto; }
  .wk-nav button { padding: 10px 12px; min-width: 42px; }
  .wk-nav button, .btn {
    font-family: var(--sans); font-size: 13.5px; font-weight: 650; padding: 10px 15px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); cursor: pointer; min-height: 44px; box-shadow: 0 1px 2px rgba(62,95,77,.08), var(--raise);
  }
  .btn.primary {
    background: linear-gradient(180deg, var(--green-hi), var(--green));
    border-color: var(--green); color: var(--on-green);
    box-shadow: 0 2px 8px rgba(62,95,77,.30), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .btn.wa {
    background: linear-gradient(180deg, #27B863, var(--wa));
    border-color: var(--wa); color: #fff;
    box-shadow: 0 2px 8px rgba(31,168,85,.30), inset 0 1px 0 rgba(255,255,255,.2);
  }
  .btn.ghost { background: transparent; box-shadow: none; }
  .btn:disabled { opacity: .35; cursor: default; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--green); outline-offset: 2px;
  }
  @media (prefers-reduced-motion: no-preference) {
    .btn:active, .mini:active, .week-row:active, .continue:active, .daytab:active, .chip10:active { transform: scale(.98); }
  }

  .card.heroobj {
    background: var(--surface);
    background: linear-gradient(180deg, color-mix(in srgb, var(--sage) 26%, var(--surface)), var(--surface) 70%);
    border: 1px solid var(--line-soft);
    border-color: color-mix(in srgb, var(--green-soft) 35%, var(--line-soft));
    border-top: 4px solid var(--green);
  }
  ul.claves b { font-weight: 750; }

  /* Mesociclos como acordeón */
  .mesohead {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--surface); border: 1px solid var(--line-soft); border-radius: 12px;
    padding: 14px 16px; margin: 14px 0 8px; cursor: pointer; font-family: inherit; color: inherit;
    box-shadow: var(--shadow), var(--raise); min-height: 54px; text-align: left;
  }
  .mesohead .mh-title { font-family: var(--display); font-weight: 400; font-size: 13.5px; text-transform: uppercase; }
  .mesohead .mh-range { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .mesohead.open { border-left: 4px solid var(--green); }
  .mesohead.open .mh-title { color: var(--green); }

  /* Etapas de sesión desglosables */
  .stagehead {
    display: flex; align-items: center; gap: 6px; background: var(--surface);
    border: 1px solid var(--line-soft); border-radius: 12px; padding: 4px 8px 4px 4px;
    margin: 12px 0 8px; box-shadow: var(--shadow), var(--raise);
  }
  .stagehead.sdone {
    background: var(--surface-2);
    background: color-mix(in srgb, var(--sage) 32%, var(--surface));
    border-color: color-mix(in srgb, var(--sage) 55%, var(--line-soft));
  }
  .sh-main {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: none; border: 0;
    cursor: pointer; padding: 10px 4px; min-height: 46px; text-align: left; color: inherit; font-family: var(--sans);
  }
  .chev { color: var(--green); font-size: 12px; width: 16px; text-align: center; flex: none; }
  .sh-name { font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .13em; text-transform: uppercase; color: var(--ink); }
  .stagehead.sdone .sh-name { color: var(--green); }
  .sh-count { font-family: var(--mono); font-size: 10px; color: var(--muted); background: var(--surface-2); border-radius: 99px; padding: 2px 8px; flex: none; }

  /* Evaluación del entreno: cuadro destacado */
  .card.evalcard {
    background: var(--surface);
    background: color-mix(in srgb, var(--sage) 16%, var(--surface));
    border-top: 3px solid var(--green);
    border-color: color-mix(in srgb, var(--green-soft) 30%, var(--line-soft));
    border-top-color: var(--green);
  }

  ul.claves { margin: 10px 0 0; padding: 0 0 0 4px; list-style: none; }
  ul.claves li {
    font-size: 13px; color: var(--ink); padding: 5px 0 5px 20px; position: relative;

(function buildSemanas() {
  for (const w of MACRO) {
    const mc = w.n <= 4 ? 1 : w.n <= 8 ? 2 : 3;
    const p = DIAS_PLAN[w.n];
    const nuevo = w.n >= 3;            // plan 21-09 desde la semana 3
    const wu = warmups(mc, nuevo);
    const dia = (nombre, nota, warm, bloque) => ({
      nombre, nota,
      secciones: [...warm, { nombre: "Bloque principal", ejercicios: bloque }, compMenu(mc)]
    });
    const wn = WU_NOTA[mc - 1] ? " " + WU_NOTA[mc - 1] : "";
    const dias = [
      dia(DIA_NOM[mc - 1][0], L_OBJ[mc - 1] + wn, wu.L, p.L),
      diaNatacion((nuevo ? NAT_V2 : NAT)[0]),
      dia(DIA_NOM[mc - 1][1], M_OBJ[mc - 1] + wn, wu.M, p.M),
      diaNatacion((nuevo ? NAT_V2 : NAT)[1]),
      dia(DIA_NOM[mc - 1][2], V_OBJ[mc - 1] + (p.vNota ? " " + p.vNota : "") + wn, wu.V, p.V)
    ];
    SEED.semanas.push(Object.assign({}, w, { meso: mc, dias }));
  }
  // Links de técnica por nombre (los de Martín tienen prioridad en LINKMAP)
  const apply = e => {
    if (e.link) return;
    const n = e.nombre.toLowerCase();
    for (const [k, url] of LINKMAP) { if (n.includes(k)) { e.link = url; return; } }
  };
  SEED.semanas.forEach(w => w.dias.forEach(d => d.secciones.forEach(s => s.ejercicios.forEach(apply))));
  SEED.entrenosSueltos.forEach(e => e.secciones.forEach(s => s.ejercicios.forEach(apply)));
})();

};
const LEVEL = t => {
  const s = String(t).toLowerCase();
  if (s === "alto" || s === "alta") return 4;
  if (s.includes("medio-alto") || s.includes("media-alta")) return 3;
  if (s.includes("bajo-medio") || s.includes("baja-media")) return 2;
  if (s.startsWith("medio") || s.startsWith("media")) return 2;
  return 1;
};
function meter(kind, label, val) {
  const n = LEVEL(val);
  const dots = "●".repeat(n) + "○".repeat(4 - n);
  return `<span class="meter ${kind}">${label} <b aria-label="${esc(val)}">${dots}</b> ${esc(String(val).toLowerCase())}</span>`;
}

function logDate(l) { const m = String(l.fecha).split("/"); return (parseInt(m[1], 10) || 0) * 100 + (parseInt(m[0], 10) || 0); }
/* Evaluaciones y notas se guardan POR SESIÓN (día del plan + fecha real), no por día del
   plan: si no, el RPE y las horas de sueño de la vez anterior reaparecen al volver al
   mismo lunes. La clave es "semana-día@fecha" y lo viejo queda como historial. */
const DIAS_SEM = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
/* El día real en que se entrenó, sacado de la fecha. El rótulo del plan puede no
   coincidir: correr el entreno del lunes al martes es normal, y eso Martín lo quiere ver. */
function diaSemanaDe(fecha) {
  const p = String(fecha).split("/");
  if (p.length < 2) return "";
  const d = new Date(FECHA_INICIO.getFullYear(), parseInt(p[1], 10) - 1, parseInt(p[0], 10));
  return DIAS_SEM[d.getDay()] || "";
}
function fechaOrd(f) { const m = String(f).split("/"); return (parseInt(m[1], 10) || 0) * 100 + (parseInt(m[0], 10) || 0); }
function sesKey(dk, fecha) { return dk + "@" + (fecha || hoy()); }
function sesFechas(obj, dk) {
  const pre = dk + "@";
  return Object.keys(obj || {}).filter(k => k.indexOf(pre) === 0).map(k => k.slice(pre.length))
    .sort((a, b) => fechaOrd(a) - fechaOrd(b));
}
function sesPrevias(obj, dk) { const h = hoy(); return sesFechas(obj, dk).filter(f => f !== h); }
function evalResumenTxt(e) {
  if (!e) return "";
  const p = [];
  if (e.rpe) p.push("RPE " + e.rpe);
  if (e.dolor24 != null) p.push("dolor 24h " + e.dolor24 + "/10");
  if (e.fatiga) p.push("fatiga " + e.fatiga);
  if (e.sueno) p.push("sueño " + e.sueno + " h");
  if (e.molestias) p.push("molestias: " + e.molestias);
  return p.join(" · ");
}
function migrateV1(st) {
  Object.entries(MIGRATE).forEach(([oldId, newId]) => {
    if (st.logs[oldId]) {
      st.logs[newId] = (st.logs[newId] || []).concat(st.logs[oldId]);
      st.logs[newId].sort((a, b) => logDate(a) - logDate(b));
      delete st.logs[oldId];
    }
  });
  st.routines = {};
  st.planV = 2;
}
/* v6→v7: evaluaciones y notas pasan a guardarse por sesión (día del plan + fecha real).
   Lo ya cargado se reetiqueta con la primera fecha registrada en ese día; nada se borra. */
function migrateV7(st) {
  const primeraFecha = (n, di) => {
    const r = (st.routines && st.routines[n] && st.routines[n].dias) ? st.routines[n] : (SEED.semanas[n - 1] || {});
    const d = (r.dias || [])[di];
    let best = null;
    if (d) d.secciones.forEach(sx => sx.ejercicios.forEach(e => ((st.logs || {})[e.id] || []).forEach(l => {
      if (best === null || fechaOrd(l.fecha) < fechaOrd(best)) best = l.fecha;
    })));
    return best;
  };
  const refechar = obj => {
    const nu = {};
    Object.entries(obj || {}).forEach(([k, v]) => {
      if (String(k).indexOf("@") >= 0) { nu[k] = v; return; }
      const sep = String(k).lastIndexOf("-");
      const n = k.slice(0, sep), di = parseInt(k.slice(sep + 1), 10);
      nu[k + "@" + (primeraFecha(n, di) || "s/f")] = v;
    });
    return nu;
  };
  st.evals = refechar(st.evals);
  st.dayNotes = refechar(st.dayNotes);
  st.planV = 7;
  return st;
}
/* v7→v8: arregla las fechas que puso migrateV7. Buscaba el registro más viejo del día
   sin exigir que cayera en la semana, y los ids que vienen de planes anteriores traen
   registros de julio y agosto: seis evaluaciones de septiembre quedaron fechadas en agosto.
   Acá se re-fecha usando solo los registros dentro de la ventana real de esa semana. */
function migrateV8(st) {
  /* Los tres días de una semana comparten los ejercicios de calentamiento, así que
     mirar todos daría siempre la fecha del primer día. Se usan los ejercicios PROPIOS
     del día (el bloque principal); si no alcanzan, se reparten las fechas de la semana
     en orden entre los días. */
  const rutina = n => (st.routines && st.routines[n] && st.routines[n].dias) ? st.routines[n] : (SEED.semanas[n - 1] || {});
  const idsDe = (n, di) => {
    const d = (rutina(n).dias || [])[di];
    const out = [];
    if (d) d.secciones.forEach(sx => sx.ejercicios.forEach(e => out.push(e.id)));
    return out;
  };
  const fechasSemana = n => {
    const set = {};
    (rutina(n).dias || []).forEach((d, i) => idsDe(n, i).forEach(id => ((st.logs || {})[id] || []).forEach(l => {
      if (enSemana(n, l.fecha)) set[l.fecha] = 1;
    })));
    return Object.keys(set).sort((a, b) => fechaOrd(a) - fechaOrd(b));
  };
  const fechaEnSemana = (n, di) => {
    const dias = rutina(n).dias || [];
    const otros = {};
    dias.forEach((d, i) => { if (i !== di) idsDe(n, i).forEach(id => { otros[id] = 1; }); });
    const propios = idsDe(n, di).filter(id => !otros[id]);
    const cuenta = {};
    propios.forEach(id => ((st.logs || {})[id] || []).forEach(l => {
      if (enSemana(n, l.fecha)) cuenta[l.fecha] = (cuenta[l.fecha] || 0) + 1;
    }));
    const porUso = Object.keys(cuenta).sort((a, b) => cuenta[b] - cuenta[a] || fechaOrd(a) - fechaOrd(b));
    if (porUso.length) return porUso[0];
    const fs = fechasSemana(n);          // sin ejercicios propios: repartir en orden
    return fs[di] || fs[fs.length - 1] || null;
  };
  const arreglar = obj => {
    const nu = {};
    Object.entries(obj || {}).forEach(([k, v]) => {
      const at = String(k).split("@");
      if (at.length < 2) { nu[k] = v; return; }
      const sep = at[0].lastIndexOf("-");
      const n = parseInt(at[0].slice(0, sep), 10), di = parseInt(at[0].slice(sep + 1), 10);
      // solo se toca lo que quedó fuera de la ventana de su propia semana
      if (at[1] !== "s/f" && enSemana(n, at[1])) { nu[k] = v; return; }
      const f = fechaEnSemana(n, di);
      nu[at[0] + "@" + (f || at[1])] = v;
    });
    return nu;
  };
  st.evals = arreglar(st.evals);
  st.dayNotes = arreglar(st.dayNotes);
  st.planV = 8;
  return st;
}
/* v8→v9: entran dos días de natación (martes y jueves) entre los de gimnasio.
   Todo lo que se indexa por posición del día —días hechos, evaluaciones, notas,
   etapas, complementarios— apunta al lugar viejo: hay que correrlo.
   Lunes 0→0 · Tren superior 1→2 · Complementario 2→4. */
const DI_V9 = { 0: 0, 1: 2, 2: 4 };
function migrateV9(st) {
  const mover = (obj, partes) => {
    const nu = {};
    Object.entries(obj || {}).forEach(([k, v]) => {
      const at = String(k).split("@");
      const p = at[0].split("-");
      if (p.length < partes) { nu[k] = v; return; }
      const di = parseInt(p[1], 10);
      if (!(di in DI_V9)) { nu[k] = v; return; }
      p[1] = String(DI_V9[di]);
      nu[p.join("-") + (at[1] !== undefined ? "@" + at[1] : "")] = v;
    });
    return nu;
  };
  st.dayDone = mover(st.dayDone, 2);
  st.evals = mover(st.evals, 2);
  st.dayNotes = mover(st.dayNotes, 2);
  st.compPick = mover(st.compPick, 2);
  st.secDone = mover(st.secDone, 3);
  st.selDay = {};
  // las rutinas ya guardadas tienen 3 días: se les insertan los de natación del plan
  Object.keys(st.routines || {}).forEach(n => {
    const r = st.routines[n], seed = SEED.semanas[n - 1];
    if (!r || !r.dias || r.dias.length !== 3 || !seed || !seed.dias) return;
    const clon = i => JSON.parse(JSON.stringify(seed.dias[i]));
    r.dias = [r.dias[0], clon(1), r.dias[1], clon(3), r.dias[2]];
    // el día de tren superior decía "Martes" y ahora la pileta ocupa ese lugar
    if (seed.dias[2] && /^Martes · /.test(r.dias[2].nombre || "")) r.dias[2].nombre = seed.dias[2].nombre;
  });
  st.planV = 9;
  return st;
}
/* v9→v10: plan 21-09. Cada dispositivo guarda una copia de la rutina de cada semana
   que visitó, así que sin esto seguiría viendo el plan viejo. Desde la semana 3 se
   reemplaza por el plan nuevo; las semanas 1 y 2 no se tocan: son lo que se entrenó.
   Los ejercicios que siguen conservan su id, así que lo anotado no se pierde. */
function migrateV10(st) {
  Object.keys(st.routines || {}).forEach(n => {
    if (parseInt(n, 10) < 3) return;
    const seed = SEED.semanas[n - 1];
    if (seed && seed.dias) st.routines[n] = JSON.parse(JSON.stringify({ dias: seed.dias }));
  });
  st.planV = 10;
  return st;
}
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return freshState();
    const parsed = JSON.parse(raw);
    const st = Object.assign(freshState(), parsed);
    if (!parsed.planV) migrateV1(st);
    // v2→v3: la estructura de días cambió (calentamientos + complementarios por día).
    // Las rutinas guardadas eran copias del seed v2 → re-sembrar; los logs quedan
    // (los ids del bloque principal y de complementarios no cambiaron).
    if ((parsed.planV || 0) < 3) {
      st.routines = {};
      st.planV = 3;
    }
    // v3→v4: plan Prevención (7/9/2026). Otro plan, otras fechas: se reinicia el progreso y se
    // re-siembra. Los pesos anotados pasan al ejercicio equivalente; las notas viejas van a Comentarios.
    if ((parsed.planV || 0) < 4) {
      Object.entries(MIGRATE_V4).forEach(([o2, nw]) => {
        if (st.logs[o2]) {
          st.logs[nw] = (st.logs[nw] || []).concat(st.logs[o2]);
          st.logs[nw].sort((a, b) => logDate(a) - logDate(b));
          delete st.logs[o2];
        }
      });
      Object.entries(st.weekNotes || {}).forEach(([n, v]) => {
        if (v && String(v).trim()) st.comments.push({ quien: "Mauro", semana: "", fecha: "ago 26", texto: "[Plan anterior · sem " + n + "] " + String(v).trim() });
      });
      st.routines = {}; st.compPick = {}; st.weekDone = {}; st.dayDone = {}; st.secDone = {};
      st.selDay = {}; st.evals = {}; st.weekNotes = {}; st.selWeek = 1;
      st.planV = 4;
    }
    // v4→v5: complementarios de elección libre (lista de ids por día; antes era un objeto por grupo)
    if ((parsed.planV || 0) < 5) {
      Object.keys(st.compPick || {}).forEach(k => { const v = st.compPick[k]; if (v && !Array.isArray(v)) st.compPick[k] = Object.values(v).filter(Boolean); });
      st.planV = 5;
    }
    // v5→v6: las notas pasan de semanales a por día (antes una nota escrita el lunes reaparecía el martes)
    if ((parsed.planV || 0) < 6) {
      if (!st.dayNotes) st.dayNotes = {};
      Object.entries(st.weekNotes || {}).forEach(([n, v]) => {
        if (v && String(v).trim()) st.dayNotes[n + "-0"] = String(v).trim();
      });
      st.weekNotes = {};
      st.planV = 6;
    }
    if ((parsed.planV || 0) < 7) migrateV7(st);
    if ((parsed.planV || 0) < 8) migrateV8(st);
    if ((parsed.planV || 0) < 9) migrateV9(st);
    if ((parsed.planV || 0) < 10) migrateV10(st);
    Object.keys(st.routines || {}).forEach(k => {
      const r = st.routines[k];
      if (Array.isArray(r)) {
        const dias = [{ nombre: "Día 1", secciones: r }];
        while (dias.length < 3) dias.push(emptyDay("Día " + (dias.length + 1)));
        st.routines[k] = { dias };
      }
    });
    return st;
  } catch (e) { return freshState(); }
}

function routineFor(n) {
  if (!S.routines[n] || !S.routines[n].dias) {

  }

}

const $ = sel => document.querySelector(sel);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
function hoy() { const d = new Date(); return d.getDate() + "/" + (d.getMonth() + 1); }
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function weekStart(n) { const d = new Date(FECHA_INICIO); d.setDate(d.getDate() + (n - 1) * 7); return d; }
function weekRange(n) {
  const a = weekStart(n), b = new Date(a); b.setDate(b.getDate() + 6);
  return a.getMonth() === b.getMonth()
    ? a.getDate() + "–" + b.getDate() + " " + MESES[a.getMonth()]
    : a.getDate() + " " + MESES[a.getMonth()] + " – " + b.getDate() + " " + MESES[b.getMonth()];
}
function curWeek() {
  const diff = Math.floor((Date.now() - weekStart(1).getTime()) / 86400000);
  return Math.min(12, Math.max(1, Math.floor(diff / 7) + 1));
}
function nfmt(v) { return String(Number(v).toFixed(1)).replace(/\.0$/, "").replace(".", ","); }
function num(v) { const x = parseFloat(String(v).replace(",", ".")); return isNaN(x) ? null : x; }
function lastLog(id) { const l = S.logs[id]; return l && l.length ? l[l.length - 1] : null; }
function todayLogs(id) { const h = hoy(); return (S.logs[id] || []).filter(l => l.fecha === h); }
function logsEnFecha(id, f) { return (S.logs[id] || []).filter(l => l.fecha === f); }
function bestPerDate(logs) {
  const by = {};
  logs.forEach(l => {
    const v = num(l.peso);
    if (v === null) return;
    if (!(l.fecha in by) || v > by[l.fecha]) by[l.fecha] = v;
  });
  return Object.values(by);
}

function restSeconds(descanso) {

  const m = s.match(/(\d+)(?:\s*[-–]\s*(\d+))?/);

    </div>` : ""}
    ${STORAGE_OK ? "" : `<div class="banner-done"><p style="margin:0"><b>⚠ Este navegador no está guardando tus datos.</b> Lo que anotes se pierde al cerrar la página — abrí la app en Safari o Chrome (no en el navegador de WhatsApp) o bajá un Backup desde Progreso antes de salir.</p></div>`}
    <main>${S.tab === "plan" ? viewPlan() : S.tab === "semana" ? viewSemana() : S.tab === "progreso" ? viewProgreso() : viewPerfil()}</main>
    <p class="footer-note">Tus registros quedan guardados en este dispositivo.<br>Desde Progreso podés descargar o mandar el resumen a Martín.</p>
  `;
  Object.entries(keep).forEach(([id, v]) => {
    const el = document.getElementById(id);
    if (el) el.value = v;
  });
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el && el !== document.activeElement) {
      try { el.focus({ preventScroll: true }); } catch (e) {}
    }
  }
  if (POP) { const el = document.querySelector('[data-id="' + CSS.escape(POP) + '"] .stick'); if (el) el.classList.add("pop"); POP = null; }
}

/* ---- Tab: Plan ---- */
function viewPlan() {
  const cw = curWeek();
  const next = !S.weekDone[cw] ? SEED.semanas[cw - 1] : SEED.semanas.find(w => !S.weekDone[w.n]);
  let h = "";
  if (next) {
    h += `
      <button class="continue" onclick="openWeek(${next.n})">
        <span>
          <span class="big">Semana ${next.n} — ${esc(next.objetivo)}</span>
          <span class="sub" style="display:block">${esc(next.bloque)} · ${weekRange(next.n)}${next.hito ? " · ◎ Reevaluación" : ""} · ${next.n === cw ? "Semana actual" : "Continuar"}</span>
        </span>
        <span class="arrow">→</span>
      </button>`;
  }
  h += `
    <div class="card heroobj">
      <h2 style="color:var(--green);font-size:14px">Objetivo general</h2>
      <p style="font-size:14.5px;font-weight:600;line-height:1.5">${esc(SEED.objetivoGeneral)}</p>
      <p class="small" style="margin-top:10px;color:var(--muted)"><b style="color:var(--ink)">Primer mesociclo:</b> ${esc(SEED.notaMetodologica)}</p>
    </div>
    <div class="card crit">
      <h2>${esc(SEED.criterios.titulo)}</h2>
      <p class="small muted" style="margin-bottom:8px">Regla de Martín para pasar de semana. Se chequea al día siguiente de cada entreno.</p>
      <ol class="critlist">${SEED.criterios.items.map(c => `<li>${esc(c)}</li>`).join("")}</ol>
      <p class="small" style="margin-top:9px"><b>${esc(SEED.criterios.regla)}</b></p>
    </div>`;
  mesoOpenInit();
  for (const m of SEED.mesociclos) {
    const abierto = !!MESOOPEN[m.n];
    h += `
      <button class="mesohead ${abierto ? "open" : ""}" onclick="toggleMeso(${m.n})" aria-expanded="${abierto}">
        <span class="mh-title">Mesociclo ${m.n} · ${esc(m.nombre)}</span>
        <span class="mh-range">Sem ${m.semanas[0]}–${m.semanas[m.semanas.length-1]} ${abierto ? "▴" : "▾"}</span>
      </button>`;
    if (!abierto) continue;
    h += `<p class="meso-obj">${esc(m.objetivo)}</p>`;
    for (const n of m.semanas) {
      const w = SEED.semanas[n - 1];
      const done = !!S.weekDone[n];
      h += `
        <button class="week-row ${n === cw && !done ? "cur" : ""}" style="--phase:${PHASE_COLOR(w.bloque)}" onclick="openWeek(${n})" aria-label="Semana ${n}: ${esc(w.objetivo)}">
          <span class="wnum">${n}</span>
          <span class="winfo">
            <span class="wtitle">${esc(w.objetivo)}</span>
            <span class="wsub">${esc(w.contenido)}</span>
            <span class="wchips">
              ${n === cw && !done ? `<span class="chip cur">En curso</span>` : ""}
              <span class="chip">${esc(w.bloque)}</span>
              ${w.hito ? `<span class="chip torneo">◎ ${esc(w.hito.replace("Reevaluación · ","Reeval. "))}</span>` : ""}
              <span class="wdate">${weekRange(n)}</span>
              ${meter("vol", "Vol", w.vol)}
              ${meter("int", "Int", w.int)}
            </span>
          </span>
          <span class="tick ${done ? "done" : ""}">✓</span>
        </button>`;
    }
  }
  h += `
    <div class="meso-head" style="margin-top:26px"><h2>Las tres fases</h2></div>
    ${Object.entries(SEED.fases).map(([f, d]) => `
      <div class="card" style="border-top:3px solid ${PHASE_COLOR(f)}">
        <span class="chip" style="--phase:${PHASE_COLOR(f)}">${esc(f)}</span>
        <p class="small muted" style="margin-top:8px">${esc(d)}</p>
      </div>`).join("")}
      <button class="continue cal" style="margin-top:16px" onclick="openCal()">
        <span>
          <span class="big">Calentamiento pre-partido</span>
          <span class="sub" style="display:block">Protocolo de Martín para antes de jugar · 20-25 min</span>
        </span>
        <span class="arrow">🎾</span>
      </button>`;
  return h;
}

/* ---- Vista: Calentamiento precompetitivo ---- */
function viewCal() {
  const C = SEED.calentamiento;
  let h = `
    <div class="card wk-header" style="--phase:var(--gold)">
      <div class="toprow">
        <div>
          <span class="chip torneo">Día de torneo</span>
          <h2 style="font-size:16px">${esc(C.titulo)} · ${esc(C.dur)}</h2>
          <p class="small muted" style="margin-top:4px">${esc(C.objetivo)}</p>
        </div>
        <button class="btn ghost" onclick="go('plan')">‹ Plan</button>
      </div>
    </div>`;
  C.fases.forEach((f, i) => {
    const open = !!CALOPEN[i];
    h += `
      <div class="fase">
        <button class="fhead" onclick="toggleFase(${i})" aria-expanded="${open}">
          <span class="fnum">${i + 1}</span>
          <span class="ftitle">${esc(f.nombre)}</span>
          <span class="fdur">${esc(f.dur)} ${open ? "▴" : "▾"}</span>
        </button>
        ${open ? `<div class="fbody">
          <p class="small muted" style="margin:10px 2px 0">${esc(f.objetivo)}</p>
          ${f.grupos.map(g => `
            <p class="fsub">${esc(g.titulo)}</p>
            <div class="prior-chips" style="margin-top:0">${g.items.map(it => `<span>${esc(it)}</span>`).join("")}</div>`).join("")}
          <p class="small" style="margin:12px 2px 6px;color:var(--gold)"><b>Clave:</b> <span class="muted">${esc(f.reco)}</span></p>
        </div>` : ""}
      </div>`;
  });
  return h;
}

/* ---- Tab: Semana ---- */
function viewSemana() {
  if (S.selWeek === "cal") return viewCal();
  if (String(S.selWeek).startsWith("e")) return viewSuelto(S.selWeek);
  const n = S.selWeek, w = SEED.semanas[n - 1];
  const done = !!S.weekDone[n];
  const rout = routineFor(n);
  const di = Math.min(S.selDay[n] || 0, rout.dias.length - 1);
  const day = rout.dias[di];
  const total = rout.dias.reduce((a, d) => a + d.secciones.reduce((b, s) => b + s.ejercicios.length, 0), 0);

  let h = `
    <div class="card wk-header" style="--phase:${PHASE_COLOR(w.bloque)}">
      <div class="toprow">
        <div>
          <span class="chip" style="--phase:${PHASE_COLOR(w.bloque)}">${esc(w.bloque)}</span>
          ${w.hito ? `<span class="chip torneo">◎ ${esc(w.hito)}</span>` : ""}
          <span class="wdate" style="margin-left:4px">${weekRange(n)}</span>
          <h2>Semana ${n} · ${esc(w.objetivo)}</h2>
          <p class="small muted" style="margin-top:3px">${esc(w.contenido)}</p>
          <p style="display:flex;gap:14px;margin-top:7px">${meter("vol", "Volumen", w.vol)} ${meter("int", "Intensidad", w.int)}</p>
        </div>
        <div class="wk-nav">
          <button ${n <= 1 ? "disabled" : ""} onclick="openWeek(${n - 1})" aria-label="Semana anterior">‹</button>
          <button ${n >= 12 ? "disabled" : ""} onclick="openWeek(${n + 1})" aria-label="Semana siguiente">›</button>
        </div>
      </div>
      <div class="rowbtns" style="margin-top:13px">
        <button class="btn ${done ? "" : "primary"}" onclick="toggleDone(${n})">${done ? "✓ Semana completada" : "Marcar semana completada"}</button>
        <button class="btn ghost" onclick="toggleEdit()">${S.edit ? "Cerrar edición" : "✎ Editar"}</button>
      </div>
    </div>`;

  if (done) {
    h += `
      <div class="banner-done">
        <p><b>Semana ${n} completada</b> 🎾 — mandale los resultados y evaluaciones a Martín:</p>
        <div class="rowbtns">
          <button class="btn primary" onclick="abrirInforme(${n},${n})">Informe de la semana</button>
          <a class="btn wa" style="text-decoration:none;display:inline-flex;align-items:center" href="${esc(waUrl(buildWeekResumen(n)))}" target="_blank" rel="noopener">WhatsApp</a>
        </div>
      </div>`;
  }
  if (!total && !S.edit) {
    h += `<div class="card"><p class="small muted">Esta semana no tiene ejercicios cargados todavía.</p></div>`;
  }

  h += `<div class="daytabs" role="tablist">`;
  rout.dias.forEach((d, i) => {
    const dk = n + "-" + i;
    h += `<button class="daytab ${i === di ? "active" : ""}" role="tab" aria-selected="${i === di}" onclick="selDay(${n},${i})">
      ${esc(d.nombre.split("·")[0].trim())} ${S.dayDone[dk] ? '<span class="dd">✓</span>' : ""}</button>`;
  });
  if (S.edit) h += `<button class="daytab add" onclick="addDay(${n})">＋ Día</button>`;
  h += `</div>`;

  const dk = n + "-" + di;
  if (day.nombre.includes("·")) {
    h += `<p class="meso-obj" style="margin-top:8px;margin-bottom:4px"><b>${esc(day.nombre.split("·")[1].trim())}</b>${day.nota ? " — " + esc(day.nota) : ""}</p>`;
  } else if (day.nota) {
    h += `<p class="meso-obj" style="margin-top:8px;margin-bottom:4px">${esc(day.nota)}</p>`;
  }
  // Progreso del día: hechos hoy sobre el total (complementarios: solo los elegidos)
  const picksHoy = pickList(n, di);
  let dTot = 0, dDone = 0;
  day.secciones.forEach(sec => {
    (sec.menu ? sec.ejercicios.filter(e => picksHoy.includes(e.id)) : sec.ejercicios).forEach(e => { dTot++; if (todayLogs(e.id).length) dDone++; });
  });
  if (dTot) h += `<div class="dayprog"><div class="bar"><span style="width:${Math.round(100 * dDone / dTot)}%"></span></div><span class="lbl">${dDone}/${dTot} hechos hoy</span></div>`;
  // Calentamiento completo: 13 de los 19 ejercicios del día en un solo toque
  const plegado = S.dayDone[dk] && !DAYOPEN[dk] && !S.edit;
  if (!S.edit && !plegado) {
    const ck = day.secciones.map((sec, si) => SEC_CALENT.some(t => sec.nombre.toLowerCase().includes(t)) ? n + "-" + di + "-" + si : null).filter(Boolean);
    if (ck.length) {
      const todo = ck.every(k => S.secDone[k]);
      h += `<div class="rowbtns" style="margin:2px 2px 10px">
        <button class="btn ${todo ? "" : "warmup"}" onclick="doCalent(${n},${di})">${todo ? "✓ Calentamiento hecho — deshacer" : "Calentamiento completo"}</button>
      </div>`;
    }
  }
  if (DFORM && DFORM.week === n && DFORM.di === di) {
    h += `
      <div class="exform">
        <label>Nombre del día</label>
        <input id="d-nombre" value="${esc(day.nombre)}" style="width:100%;font-size:16px;padding:10px;min-height:44px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)">
        <div class="rowbtns">
          <button class="btn primary" onclick="renameDay()">Guardar</button>
          <button class="btn ghost" onclick="DFORM=null;render()">Cancelar</button>
        </div>
      </div>`;
  }
  if (S.edit) {
    const kd = "day:" + n + ":" + di;
    h += `<div class="rowbtns" style="margin:4px 2px 6px">
      <button class="mini" onclick="openDayForm(${n},${di})">✎ Nombre del día</button>
      ${rout.dias.length > 1 ? `<button class="mini warn ${armed(kd) ? "armed" : ""}" onclick="delDay(${n},${di})">${armed(kd) ? "¿Seguro? Sí, borrar día" : "Borrar día"}</button>` : ""}
    </div>`;
  }

  // Día ya completado → se muestra plegado. Un toque lo vuelve a abrir.
  if (plegado) {
    const fEv = sesFechas(S.evals, dk), fNo = sesFechas(S.dayNotes, dk);
    const fecha = fEv.concat(fNo).sort((a, b) => fechaOrd(b) - fechaOrd(a))[0] || "";
    const evTxt = fecha ? evalResumenTxt(S.evals[sesKey(dk, fecha)]) : "";
    let sDone = 0;
    if (fecha) day.secciones.forEach(sec => {
      (sec.menu ? sec.ejercicios.filter(e => picksHoy.includes(e.id)) : sec.ejercicios)
        .forEach(e => { if (logsEnFecha(e.id, fecha).length) sDone++; });
    });
    h += `<button class="daydone-card" onclick="openDay('${dk}')">
        <span class="dd-tick">✓</span>
        <span class="dd-body">
          <b>Día completado${fecha ? " · " + esc(fecha) : ""}</b>
          <span>${fecha ? sDone : dDone} de ${dTot} ejercicios${evTxt ? " · " + esc(evTxt) : ""}</span>
        </span>
        <span class="dd-chev">Ver detalle ▾</span>
      </button>
      <div class="rowbtns" style="margin:10px 0 4px">
        <button class="btn ghost" onclick="toggleDayDone('${dk}')">Desmarcar día</button>
      </div>`;
    return h;
  }
  if (S.dayDone[dk] && DAYOPEN[dk]) {
    const fs = sesFechas(S.evals, dk).concat(sesFechas(S.dayNotes, dk)).sort((a, b) => fechaOrd(b) - fechaOrd(a))[0];
    if (fs && fs !== hoy()) {
      h += `<p class="viewnote">Este entreno se registró el <b>${esc(fs)}</b>. Lo que marques ahora se guarda con la fecha de hoy (${esc(hoy())}).</p>`;
    }
  }
  const dayEmpty = !day.secciones.reduce((a, s) => a + s.ejercicios.length, 0);
  if (dayEmpty && !S.edit) {
    h += `<div class="card"><p class="small muted">Este día no tiene ejercicios cargados todavía.</p></div>`;
  }
  day.secciones.forEach((sec, si) => {
    const sk = n + "-" + di + "-" + si;
    const done = !!S.secDone[sk];
    // Solo el Bloque principal queda a la vista; el resto se despliega al tocar
    const open = S.edit ? true : (sk in SECOPEN ? SECOPEN[sk] : (sec.nombre === "Bloque principal" || sec.nombre === "Sesión"));
    if (S.edit) {
      h += `<div class="section-title"><h3>${esc(sec.nombre)}</h3>
        <button class="mini acc" onclick="openForm(${n},${di},${si},null)">＋ Ejercicio</button></div>`;
    } else {
      h += `
      <div class="stagehead ${done ? "sdone" : ""}">
        <button class="sh-main" onclick="toggleSecOpen('${sk}')" aria-expanded="${open}">
          <span class="chev">${open ? "▾" : "▸"}</span>
          <span class="sh-name">${esc(sec.nombre)}${done ? " ✓" : ""}</span>
          <span class="sh-count">${sec.menu ? (menuPicked(sec, n, di) || "elegir") : sec.ejercicios.length}</span>
        </button>
        <button class="stick ${done ? "done" : ""}" onclick="toggleSec('${sk}')" aria-label="${done ? "Etapa hecha" : "Marcar etapa"}">✓</button>
      </div>`;
    }
    if (!open) return;
    if (sec.menu && !S.edit) { h += menuHtml(sec, n, di, si); return; }
    if (FORM && FORM.week === n && FORM.di === di && FORM.si === si && FORM.ei === null) h += formHtml(null);
    if (!sec.ejercicios.length && !(FORM && FORM.week === n && FORM.di === di && FORM.si === si)) {
      h += `<p class="small muted" style="margin:0 2px 8px">—</p>`;
    }
    sec.ejercicios.forEach((exo, ei) => {
      if (sec.menu) { const g = (sec.grupos || []).find(g2 => g2.ejercicios[0] && g2.ejercicios[0].id === exo.id); if (g) h += `<p class="menu-sub">${esc(g.nombre)}</p>`; }
      if (FORM && FORM.week === n && FORM.di === di && FORM.si === si && FORM.ei === ei) { h += formHtml(exo); return; }
      h += exCard(exo, { week: n, di, si, ei });
    });
  });

  // Evaluación del entreno — hoja "Evaluaciones" de Martín + dolor de rodilla al día siguiente
  const notaHoy = (S.dayNotes[sesKey(dk)] || "").trim();
  const ev = S.evals[sesKey(dk)] || {};
  const hasEv = ev.rpe || ev.fatiga || ev.molestias || ev.sueno || ev.dolor24 != null;
  const evPrev = sesPrevias(S.evals, dk).filter(f => evalResumenTxt(S.evals[sesKey(dk, f)]));
  const rpeRead = v => { const r = SEED.rpeTabla.find(x => { const q = x[0].split("-").map(Number); return q.length === 2 ? v >= q[0] && v <= q[1] : q[0] === v; }); return r ? r[1] + " — " + r[2] : ""; };
  const fatRead = v => v <= 3 ? "Baja — recuperación fácil" : v <= 6 ? "Media — normal para un día de carga" : v <= 8 ? "Alta — ojo con el volumen" : "Muy alta — hablarlo con Martín";
  const dolRead = v => v <= 3 ? "Dentro de lo tolerado — se puede progresar" : v <= 6 ? "Atención — mantener la carga, no subir" : "Frenar y avisarle a Martín";
  const chips = (campo, from, to, sel, hiFrom) => `<div class="chips10">${Array.from({ length: to - from + 1 }, (_, i) => from + i).map(v => `<button class="chip10 ${sel === v ? "sel" : ""} ${hiFrom != null && v >= hiFrom ? "hi" : ""}" onclick="setEval('${dk}','${campo}',${v})">${v}</button>`).join("")}</div>`;
  h += `
    <div class="section-title"><h3>Evaluación del entreno</h3>
      <span style="display:flex;gap:6px">
        <button class="mini" onclick="RPEREF=!RPEREF;render()">${RPEREF ? "Ocultar guía" : "¿Qué es RPE?"}</button>
        ${hasEv ? `<button class="mini warn ${armed("ev:" + dk) ? "armed" : ""}" onclick="delEval('${dk}')">${armed("ev:" + dk) ? "¿Seguro?" : "Borrar"}</button>` : ""}
      </span></div>
    ${RPEREF ? `<div class="card"><ul class="rpe-table">${SEED.rpeTabla.map(r => `<li><b>${esc(r[0])}</b><span><b style="color:var(--ink);font-family:var(--sans);min-width:0">${esc(r[1])}</b> · ${esc(r[2])}</span></li>`).join("")}</ul></div>` : ""}
    <div class="card evblock ev-entreno">
      <p class="evhead">Entreno</p>
      <p class="evlabel">RPE — qué tan exigente fue (1-10)</p>
      ${chips("rpe", 1, 10, ev.rpe)}
      ${ev.rpe ? `<p class="evread"><b>${ev.rpe}</b><span>${esc(rpeRead(ev.rpe))}</span></p>` : ""}
      <p class="evlabel">Sensación de fatiga (1-10)</p>
      ${chips("fatiga", 1, 10, ev.fatiga)}
      ${ev.fatiga ? `<p class="evread"><b>${ev.fatiga}</b><span>${esc(fatRead(ev.fatiga))}</span></p>` : ""}
    </div>
    <div class="card evblock ev-rodilla">
      <p class="evhead">Rodilla</p>
      <p class="evlabel">Dolor al día siguiente (0-10) · se completa al otro día</p>
      ${chips("dolor24", 0, 10, ev.dolor24, 4)}
      ${ev.dolor24 != null
        ? `<p class="evread ${ev.dolor24 >= 7 ? "bad" : ev.dolor24 >= 4 ? "warn" : ""}"><b>${ev.dolor24}</b><span>${esc(dolRead(ev.dolor24))}</span></p>`
        : `<p class="small muted" style="margin:6px 0 0">Es la señal que mira Martín para progresar: sin aumento de inflamación al día siguiente.</p>`}
      <p class="evlabel">Dolores o molestias</p>
      <input type="text" class="evinput" id="ev-mol-${dk}" value="${esc(ev.molestias || "")}" placeholder="Ninguna / rodilla izquierda al bajar…" onchange="setEvalTxt('${dk}','molestias',this.value)">
    </div>
    <div class="card evblock ev-sueno">
      <p class="evhead">Descanso</p>
      <p class="evlabel">Horas de sueño la noche anterior</p>
      <input type="text" class="evinput" id="ev-sue-${dk}" value="${esc(ev.sueno || "")}" placeholder="7,5" inputmode="decimal" onchange="setEvalTxt('${dk}','sueno',this.value)">
    </div>`;
  if (evPrev.length) {
    const ab = !!EVHIST[dk];
    h += `<button class="sesprev" onclick="toggleEvHist('${dk}')" aria-expanded="${ab}">
        <span>${ab ? "▾" : "▸"} Evaluaciones anteriores de este día</span><span class="n">${evPrev.length}</span></button>
      ${ab ? `<div class="card sesprev-body"><ul class="seslist">${evPrev.slice().reverse().map(f => {
        const k2 = "evs:" + dk + ":" + f;
        return `<li><b>${esc(f)}</b><span>${esc(evalResumenTxt(S.evals[sesKey(dk, f)]))}</span>
          <button class="xdel ${armed(k2) ? "armed" : ""}" onclick="delEvalSes('${dk}','${esc(f)}')" aria-label="Borrar evaluación">${armed(k2) ? "¿Borrar?" : "✕"}</button></li>`;
      }).join("")}</ul></div>` : ""}`;
  }

  h += `
    <div class="rowbtns" style="margin:16px 0 4px">
      <button class="btn ${S.dayDone[dk] ? "" : "primary"}" onclick="toggleDayDone('${dk}')">${S.dayDone[dk] ? "✓ Día completado" : "Marcar día completado"}</button>
    </div>
    <div class="section-title"><h3>Nota del día</h3>
      ${notaHoy && NOTEDIT !== dk ? `<span style="display:flex;gap:6px">
        <button class="mini" onclick="editNote('${dk}')">✎ Editar</button>
        <button class="mini warn ${armed("note:" + dk) ? "armed" : ""}" onclick="clearNote('${dk}')">${armed("note:" + dk) ? "¿Seguro?" : "Borrar"}</button></span>` : ""}</div>
    ${notaHoy && NOTEDIT !== dk
      ? `<div class="card notesaved"><p>${esc(notaHoy)}</p></div>`
      : `<div class="card">
          <textarea class="notes" id="dn-${dk}" placeholder="Sensaciones, molestias, ajustes de hoy…">${esc(notaHoy)}</textarea>
          <div class="rowbtns"><button class="btn primary" onclick="saveNote('${dk}')">Guardar nota</button>${NOTEDIT === dk ? `<button class="btn ghost" onclick="NOTEDIT=null;render()">Cancelar</button>` : ""}</div>
        </div>`}`;
  const notPrev = sesPrevias(S.dayNotes, dk).filter(f => (S.dayNotes[sesKey(dk, f)] || "").trim());
  if (notPrev.length) {
    const ab = !!NOTEHIST[dk];
    h += `<button class="sesprev" onclick="toggleNoteHist('${dk}')" aria-expanded="${ab}">
        <span>${ab ? "▾" : "▸"} Notas anteriores de este día</span><span class="n">${notPrev.length}</span></button>
      ${ab ? `<div class="card sesprev-body"><ul class="seslist">${notPrev.slice().reverse().map(f =>
        `<li><b>${esc(f)}</b><span>${esc(S.dayNotes[sesKey(dk, f)])}</span></li>`).join("")}</ul></div>` : ""}`;
  }
  return h;
}

/* ---- Complementarios: elección libre. Martín sugiere uno por grupo; si la zona ya se trabajó en la
   rutina, no hace falta. La elección se guarda por semana+día como lista de ids. ---- */
function pickKey(n, di) { return n + "-" + di; }
function pickList(n, di) { const v = S.compPick[pickKey(n, di)]; return Array.isArray(v) ? v : []; }
function menuPicked(sec, n, di) { const ids = new Set(sec.ejercicios.map(e => e.id)); return pickList(n, di).filter(id => ids.has(id)).length; }
function menuHtml(sec, n, di, si) {
  const picks = pickList(n, di);
  const enGrupo = new Set();
  let h = `<p class="menu-hint">Tocá los que vas a hacer hoy. Martín sugiere <b>uno por grupo</b> — si esa zona ya la trabajaste en la rutina, salteala.</p>`;
  (sec.grupos || []).forEach(g => {
    g.ejercicios.forEach(e => enGrupo.add(e.id));
    const elegidos = g.ejercicios.filter(e => picks.includes(e.id));
    h += `

window.togglePick = (n, di, id) => {
  const k = pickKey(n, di), cur = pickList(n, di);
  const add = !cur.includes(id);
  S.compPick[k] = add ? cur.concat(id) : cur.filter(x => x !== id);
  if (add) autoDone(id); else autoUndo(id);
  // elegir ya es hacer: a partir de 2 la etapa queda tildada sola (no se cierra:
  // Mauro acaba de elegir ahí y cerrarla de golpe lo desorienta)
  const day = routineFor(n).dias[di];
  const si = day.secciones.findIndex(sx => sx.menu);
  if (si >= 0) S.secDone[n + "-" + di + "-" + si] = S.compPick[k].length >= 2;
  save(); render();
};

      ${hoyVals.length > 1 ? `<p class="hoy">Hoy: <b>${hoyVals.map(l => esc(l.peso)).join(" · ")}</b> — el progreso cuenta la mejor</p>` : ""}
      ${open ? `<ul class="hist">${hist.map((l, i) => ({ l, i })).reverse().map(({ l, i }) => {

      <div class="logline">

        ${fold}

      ${exo.aprox || exo.descanso ? `<p class="ex-detail">${esc([exo.aprox, exo.descanso ? "Descanso " + exo.descanso : ""].filter(Boolean).join("  ·  "))}</p>` : ""}
      <div class="ex-links">

        ${rest ? `<button class="timerbtn" onclick="timerStart(${rest})">⏱ Descanso ${rest}″</button>` : ""}
      </div>

      ${S.edit && pos ? (() => { const k = "ex:" + pos.week + ":" + pos.di + ":" + pos.si + ":" + pos.ei; return `<div class="rowbtns">
        <button class="mini" onclick="openForm(${pos.week},${pos.di},${pos.si},${pos.ei})">✎ Editar</button>

      </div>`; })() : ""}

}

/* ---- Tab: Progreso ---- */
function sparkline(vals, w, h) {
  if (vals.length < 2) return "";
  w = w || 84; h = h || 26;
  const pad = 3;
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = max - min || 1;
  const pts = vals.map((v, i) => {
    const x = pad + (i * (w - 2 * pad)) / (vals.length - 1);
    const y = h - pad - ((v - min) * (h - 2 * pad)) / span;
    return x.toFixed(1) + "," + y.toFixed(1);
  });
  const [lx, ly] = pts[pts.length - 1].split(",");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polyline points="${pts.join(" ")}"/><circle cx="${lx}" cy="${ly}" r="2.4"/></svg>`;
}
function bigSpark(vals) {
  if (vals.length < 2) return "";
  const w = 320, h = 56, pad = 4;
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = max - min || 1;
  const pts = vals.map((v, i) => {
    const x = pad + (i * (w - 2 * pad)) / (vals.length - 1);
    const y = h - pad - ((v - min) * (h - 2 * pad)) / span;
    return x.toFixed(1) + "," + y.toFixed(1);
  });
  const [lx, ly] = pts[pts.length - 1].split(",");
  return `<svg class="bigspark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${pts.join(" ")}"/><circle cx="${lx}" cy="${ly}" r="3"/></svg>`;
}
let EXCACHE = null;
function exById(id) {
  if (!EXCACHE) { EXCACHE = {}; walkAll(exo => { if (!EXCACHE[exo.id]) EXCACHE[exo.id] = exo; }); }
  return EXCACHE[id] || null;
}
/* "4 × 8" → 4 series de 8 reps. Sirve para los casilleros de serie y para el tonelaje. */
function seriesDe(exo) { const m = String(exo && exo.esquema || "").match(/(\d+)\s*[×x]/); return m ? Math.min(8, parseInt(m[1], 10)) : 0; }
function repsDe(exo) { const m = String(exo && exo.esquema || "").match(/[×x]\s*(\d+)/); return m ? parseInt(m[1], 10) : 0; }
function walkAll(fn) {
  const seen = new Set();
  for (let n = 1; n <= SEED.semanas.length; n++) {
    const r = S.routines[n] && S.routines[n].dias ? S.routines[n] : SEED.semanas[n - 1];
    (r.dias || []).forEach(d => d.secciones.forEach(s => s.ejercicios.forEach(exo => {
      if (!seen.has(exo.id)) { seen.add(exo.id); fn(exo, "Sem " + n + " · " + d.nombre.split("·")[0].trim()); }
    })));
  }
  SEED.entrenosSueltos.forEach(e => e.secciones.forEach(s => s.ejercicios.forEach(exo => {
    if (!seen.has(exo.id)) { seen.add(exo.id); fn(exo, e.nombre); }
  })));
}

function viewProgreso() {
  const hayDatos = Object.keys(S.logs).length > 0 || S.bodyLog.length > 0;
  const dias = S.lastBackupTs ? Math.floor((Date.now() - S.lastBackupTs) / 86400000) : null;
  const avisoBackup = hayDatos && (dias === null || dias >= 14)

  const daysCount = Object.values(S.dayDone).filter(Boolean).length;
  const logged = Object.keys(S.logs).filter(k => S.logs[k].length).length;
  const nextHito = SEED.semanas.find(w => w.hito && !S.weekDone[w.n]);
  let h = avisoBackup + `

      <div class="stat"><div class="n">${daysCount}</div><div class="l">Entrenos hechos</div></div>
      <div class="stat"><div class="n">${logged}</div><div class="l">Ej. con registro</div></div>

      ${nextHito ? `<p class="small muted" style="margin-top:11px">Próximo hito: <b style="color:var(--gold)">◎ ${esc(nextHito.hito)}</b> — semana ${nextHito.n} (${weekRange(nextHito.n)})</p>` : ""}
    </div>`;

  // --- adherencia semana a semana ---
  const cw3 = curWeek();
  const adh = [];
  for (let n = 1; n <= cw3; n++) adh.push({ l: "Sem " + n, v: sesionesHechas(n), tot: routineFor(n).dias.length });
  if (adh.length) {
    const hh = adh.reduce((a, r) => a + r.v, 0), pp = adh.reduce((a, r) => a + r.tot, 0);
    h += `<div class="card"><h2>Adherencia</h2>
      <p class="small muted" style="margin-bottom:10px">Sesiones completadas sobre las planificadas hasta hoy: <b style="color:var(--ink)">${hh} de ${pp}</b> (${pp ? Math.round(100 * hh / pp) : 0}%).</p>
      ${barChart(adh, { fmt: (v, r) => v + "/" + (r && r.tot || 3) })}</div>`;
  }

  // --- rodilla: el número que decide si se progresa ---
  const sesAll = sesionesPlan(1, 12);
  const dolorS = sesAll.filter(x => x.ev && x.ev.dolor24 != null).map(x => ({ f: x.fecha, v: x.ev.dolor24 }));
  const rpeS = sesAll.filter(x => x.ev && x.ev.rpe).map(x => ({ f: x.fecha, v: x.ev.rpe }));
  if (dolorS.length || rpeS.length) {
    const picos = dolorS.filter(d => d.v >= 4).length;
    h += `<div class="card"><h2>Rodilla y esfuerzo</h2>`;
    if (dolorS.length) {
      h += `<p class="small muted" style="margin-bottom:4px">Dolor a las 24 h — el criterio de Martín para subir carga.</p>
        ${lineChart(dolorS, { max: 10, corte: 4, corteTxt: "umbral 4", cls: "clay", label: "Dolor 24 h" })}
        <p class="small" style="margin-top:6px;color:${picos ? "var(--clay)" : "var(--green)"}">

          <span class="muted"> — ${picos === 0 ? "hay margen para progresar." : "mantener carga hasta que baje."}</span></p>`;
    }
    if (rpeS.length) {
      h += `<p class="small muted" style="margin:14px 0 4px">Esfuerzo percibido (RPE) por sesión.</p>
        ${lineChart(rpeS, { max: 10, cls: "green", label: "RPE" })}`;
    }
    h += `</div>`;
  }

  // --- tonelaje ---
  const tonR = [];
  for (let n = 1; n <= cw3; n++) tonR.push({ l: "Sem " + n, v: tonelajeSemana(n) });
  if (tonR.some(t => t.v > 0)) {
    h += `<div class="card"><h2>Volumen de carga</h2>
      <p class="small muted" style="margin-bottom:10px">Peso × repeticiones, sumado por semana. Sirve para ver si la progresión es real o es sensación.</p>
      ${barChart(tonR, { fmt: v => v ? Math.round(v / 100) / 10 + " t" : "—" })}</div>`;
  }

  // --- evolución de pesos, agrupada por ejercicio ---
  const cargas = cargasPorEjercicio(1, 12);
  const q = FILTQ.trim().toLowerCase();
  const shown = cargas.filter(m => !q || (m.nombre + " " + m.esquemas.join(" ")).toLowerCase().includes(q));
  h += `<div class="card"><h2>Evolución de pesos</h2>

    shown.forEach(m => {

    h += `<ul class="hist" style="margin-top:10px">${S.bodyLog.map((b, i) => ({ b, i })).reverse().map(({ b, i }) => {
      const k = "bw:" + i;
      return `<li><span>${esc(b.fecha)}${b.nota ? " · " + esc(b.nota) : ""}</span><b>${esc(b.peso)}</b>
        <button class="xdel ${armed(k) ? "armed" : ""}" onclick="delBody(${i})" aria-label="Borrar pesaje">${armed(k) ? "¿Borrar?" : "✕"}</button></li>`; }).join("")}</ul>`;
  } else {
    h += `<p class="small muted" style="margin-top:8px">Pesate una vez por semana (mismo día, misma hora, en ayunas) y anotalo acá.</p>`;
  }
  h += `</div>

    <div class="card">
      <h2>Último InBody · ${esc(ib.fecha)}</h2>
      <div class="kpis">
        <span class="kpi"><span class="v">${ib.peso} kg</span> <span class="delta ${ib.peso <= ibPrev.peso ? "down" : "up"}">${(ib.peso - ibPrev.peso).toFixed(1)}</span><br><span class="k">Peso</span></span>
        <span class="kpi"><span class="v">${ib.pgc}%</span> <span class="delta ${ib.pgc <= ibPrev.pgc ? "down" : "up"}">${(ib.pgc - ibPrev.pgc).toFixed(1)}</span><br><span class="k">Grasa corporal</span></span>
        <span class="kpi"><span class="v">${ib.grasaKg} kg</span> <span class="delta ${ib.grasaKg <= ibPrev.grasaKg ? "down" : "up"}">${(ib.grasaKg - ibPrev.grasaKg).toFixed(1)}</span><br><span class="k">Masa grasa</span></span>
        <span class="kpi"><span class="v">${ib.mme} kg</span> <span class="delta ${ib.mme >= ibPrev.mme ? "down" : "up"}">${(ib.mme - ibPrev.mme).toFixed(1)}</span><br><span class="k">Músculo (MME)</span></span>
        <span class="kpi"><span class="v">${ib.visceral}</span> <span class="delta" style="color:var(--muted)">rango 1–9</span><br><span class="k">Grasa visceral</span></span>
        <span class="kpi"><span class="v">${ib.imc}</span> <span class="delta ${ib.imc <= ibPrev.imc ? "down" : "up"}">${(ib.imc - ibPrev.imc).toFixed(1)}</span><br><span class="k">IMC</span></span>

    </div>`;
  return h;

const WD_MAP = { 1: 0, 2: 1, 3: 2, 4: 3, 5: 4 }; // lun→inferior, mar→natación 1, mié→superior, jue→natación 2, vie→complementario
window.go = t => { S.tab = t; FORM = null; DFORM = null; ASK = null; save(); render(); window.scrollTo(0, 0); };
window.openWeek = n => {
  S.selWeek = n; S.tab = "semana"; FORM = null; DFORM = null; ASK = null;
  if (S.selDay[n] === undefined && n === curWeek()) {
    const wd = WD_MAP[new Date().getDay()];
    if (wd !== undefined) S.selDay[n] = wd;
  }
  save(); render(); window.scrollTo(0, 0);
};
window.openSuelto = id => { S.selWeek = id; S.tab = "semana"; FORM = null; DFORM = null; ASK = null; save(); render(); window.scrollTo(0, 0); };

window.toggleDone = n => { S.weekDone[n] = !S.weekDone[n]; save(); render(); };
window.toggleDayDone = dk => {
  S.dayDone[dk] = !S.dayDone[dk];
  DAYOPEN[dk] = !S.dayDone[dk];   // completar pliega el día; desmarcar lo vuelve a abrir
  ASK = null; save(); render(); window.scrollTo(0, 0);
};
window.openDay = dk => { DAYOPEN[dk] = true; render(); };
/* Marcar una etapa tilda todos sus ejercicios y la minimiza. Destildar borra SOLO
   los registros automáticos: un peso anotado a mano nunca se pierde. */
function secDe(sk) {
  const p = String(sk).split("-");
  const n = p[0], di = parseInt(p[1], 10), si = parseInt(p[2], 10);
  const rout = routineFor(n), day = rout && rout.dias[di];
  return day ? day.secciones[si] : null;
}
function secEjercicios(sk) {
  const sec = secDe(sk);
  if (!sec) return [];
  if (sec.menu) {
    const p = String(sk).split("-"), ids = pickList(p[0], parseInt(p[1], 10));
    return sec.ejercicios.filter(e => ids.includes(e.id));
  }
  return sec.ejercicios;
}
function autoDone(id) {
  if (todayLogs(id).length) return;               // ya hay algo de hoy: no pisar
  if (!S.logs[id]) S.logs[id] = [];
  S.logs[id].push({ fecha: hoy(), peso: "✓", esf: "", nota: "", auto: true });
}
function autoUndo(id) {
  const h = hoy(), l = S.logs[id] || [];
  S.logs[id] = l.filter(x => !(x.fecha === h && x.auto));
  if (!S.logs[id].length) delete S.logs[id];
}
window.toggleSec = sk => {
  const marcar = !S.secDone[sk];
  secEjercicios(sk).forEach(e => marcar ? autoDone(e.id) : autoUndo(e.id));
  S.secDone[sk] = marcar;
  if (marcar) { SECOPEN[sk] = false; POP = null; }
  ASK = null; save(); render();
};
/* Calentamiento completo: movilidad + activación + preparación específica de una */
const SEC_CALENT = ["movilidad", "activaci", "preparaci", "potenciaci"];
window.doCalent = (n, di) => {
  const rout = routineFor(n);
  const day = rout.dias[di];
  const keys = [];
  day.secciones.forEach((sec, si) => {
    if (SEC_CALENT.some(t => sec.nombre.toLowerCase().includes(t))) keys.push(n + "-" + di + "-" + si);
  });
  const marcar = !keys.every(k => S.secDone[k]);
  keys.forEach(k => {
    secEjercicios(k).forEach(e => marcar ? autoDone(e.id) : autoUndo(e.id));
    S.secDone[k] = marcar;
    if (marcar) SECOPEN[k] = false;
  });
  ASK = null; save(); render();
};
window.toggleSecOpen = sk => {
  const day = String(S.selWeek), cur = SECOPEN[sk];
  const rout = routineFor(S.selWeek);
  const di = Math.min(S.selDay[S.selWeek] || 0, rout.dias.length - 1);
  const sec = rout.dias[di].secciones[parseInt(sk.split("-")[2], 10)];
  const defOpen = sec && (sec.nombre === "Bloque principal" || sec.nombre === "Sesión");
  SECOPEN[sk] = sk in SECOPEN ? !cur : !defOpen;
  render();
};
window.toggleMeso = mn => { mesoOpenInit(); MESOOPEN[mn] = !MESOOPEN[mn]; render(); };
window.toggleEdit = () => { S.edit = !S.edit; FORM = null; DFORM = null; save(); render(); };

window.markDone = id => {
  if (!todayLogs(id).length) { if (!S.logs[id]) S.logs[id] = []; S.logs[id].push({ fecha: hoy(), peso: "✓", esf: "", nota: "" }); }
  EXPANDED[id] = false; POP = id; ASK = null; save(); render();
};
window.collapseEx = id => { EXPANDED[id] = false; render(); };
window.expandEx = id => { EXPANDED[id] = true; render(); };
window.undoDone = id => {
  const l = S.logs[id] || [], h = hoy();
  if (l.some(x => x.fecha === h && x.peso !== "✓")) { EXPANDED[id] = true; render(); return; }   // hay datos reales: abrir, nunca borrar
  S.logs[id] = l.filter(x => !(x.fecha === h && x.peso === "✓"));
  if (!S.logs[id].length) delete S.logs[id];
  save(); render();
};
window.addLog = id => {
  const w = $("#w-" + CSS.escape(id)), ef = $("#e-" + CSS.escape(id)), nt = $("#n-" + CSS.escape(id));
  const peso = (w.value || "").trim();
  if (!peso) { w.focus(); return; }
  if (!S.logs[id]) S.logs[id] = [];
  S.logs[id].push({ fecha: hoy(), peso, esf: (ef.value || "").trim(), nota: (nt.value || "").trim() });
  w.value = ""; ef.value = ""; nt.value = "";
  EXPANDED[id] = false; POP = id;  // anotar = hecho ✓ y se cierra; el peso queda visible en la fila
  ASK = null;
  save(); render();
  // el descanso arranca solo: con el celular apoyado nadie toca el cronómetro
  const exo = exById(id), rest = exo ? restSeconds(exo.descanso) : 0;
  if (rest) timerStart(rest);
};
window.addDone = id => {
  if (!S.logs[id]) S.logs[id] = [];
  const h = hoy();
  const ya = S.logs[id].findIndex(l => l.fecha === h);
  if (ya >= 0) S.logs[id].splice(ya, 1);
  else S.logs[id].push({ fecha: h, peso: "✓", esf: "", nota: "" });
  POP = ya >= 0 ? null : id;
  if (!S.logs[id].length) delete S.logs[id];
  save(); render();
};
window.delLog = (id, idx) => {
  const l = S.logs[id];
  if (!l || !l[idx]) return;
  if (!confirmTap("log:" + id + ":" + idx)) return;
  l.splice(idx, 1);
  if (!l.length) { delete S.logs[id]; delete S.openHist[id]; }
  save(); render();
};

  const val = id => ($("#" + id) ? $("#" + id).value.trim() : "");
  const nombre = val("f-nombre");

  const data = { nombre, esquema: val("f-esquema"), aprox: val("f-aprox"), obs: val("f-obs"), descanso: val("f-descanso"), link: val("f-link"),

  if (FORM.ei === null) {

  } else {
    Object.assign(sec.ejercicios[FORM.ei], data);
  }
  FORM = null; save(); render();
};
/* Un id puede vivir en varias semanas (complementarios del mesociclo): solo
   borrar su historial cuando no queda ninguna instancia. Las semanas todavía
   no visitadas viven en el SEED, así que también cuentan. */
function idEnUso(id) {
  let usado = false;
  const scan = dias => dias.forEach(d => d.secciones.forEach(s =>
    s.ejercicios.forEach(e2 => { if (e2.id === id) usado = true; })));
  for (let n = 1; n <= SEED.semanas.length; n++) {
    const r = S.routines[n];
    if (r && r.dias) scan(r.dias);
    else if (SEED.semanas[n - 1].dias) scan(SEED.semanas[n - 1].dias);
  }
  return usado;
}

/* ---- Timer de descanso (anclado al reloj real) ---- */
let TIMER = null;
function timerRemain() {
  if (!TIMER) return 0;
  if (TIMER.paused) return TIMER.pausedRemain;
  return Math.max(0, Math.ceil((TIMER.endAt - Date.now()) / 1000));
}
function timerRender() {
  const el = $("#timer"), t = $("#timer-t");
  if (!TIMER) { el.classList.remove("on", "zero"); return; }
  el.classList.add("on");
  const s = timerRemain();
  t.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  $("#timer-p").textContent = TIMER.paused ? "Seguir" : "Pausa";
}
function timerTick() {
  if (!TIMER || TIMER.paused || TIMER.done) return;
  if (timerRemain() <= 0) {
    TIMER.done = true;
    clearInterval(TIMER.iv); TIMER.iv = null;
    $("#timer").classList.add("zero");
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
    TIMER.closeT = setTimeout(() => { if (TIMER && TIMER.done) { TIMER = null; timerRender(); } }, 4000);
  }
  timerRender();
}
function timerClear() {
  if (!TIMER) return;
  if (TIMER.iv) clearInterval(TIMER.iv);
  if (TIMER.closeT) clearTimeout(TIMER.closeT);
  TIMER = null;
  $("#timer").classList.remove("zero");
}
window.timerStart = secs => {
  timerClear();
  TIMER = { endAt: Date.now() + secs * 1000, paused: false, done: false, iv: setInterval(timerTick, 250) };
  timerRender();
};
window.timerAdd = s => {
  if (!TIMER) return;
  if (TIMER.done) {
    clearTimeout(TIMER.closeT);
    $("#timer").classList.remove("zero");
    TIMER = { endAt: Date.now() + s * 1000, paused: false, done: false, iv: setInterval(timerTick, 250) };
  } else if (TIMER.paused) {
    TIMER.pausedRemain += s;
  } else {
    TIMER.endAt += s * 1000;
  }
  timerRender();
};
window.timerPause = () => {
  if (!TIMER || TIMER.done) return;
  if (TIMER.paused) {
    TIMER.endAt = Date.now() + TIMER.pausedRemain * 1000;
    TIMER.paused = false;
  } else {
    TIMER.pausedRemain = timerRemain();
    TIMER.paused = true;
  }
  timerRender();
};
window.timerStop = () => { timerClear(); timerRender(); };
document.addEventListener("visibilitychange", () => { if (!document.hidden) timerTick(); });

/* ================= INFORME PARA MARTÍN =================
   Un registro puede repetirse en varias semanas (los complementarios comparten id),
   así que todo se acota a la ventana de fechas de cada semana. */
function enSemana(n, fecha) {
  const a = weekStart(n), b = new Date(a); b.setDate(b.getDate() + 6);
  const o = fechaOrd(fecha);
  return o >= (a.getMonth() + 1) * 100 + a.getDate() && o <= (b.getMonth() + 1) * 100 + b.getDate();
}
/* Una fecha = una sesión. Los tres días de la semana comparten los ejercicios de
   calentamiento, así que agrupar por día del plan hacía aparecer un mismo entreno
   tres veces. Se agrupa por fecha y se rotula con el día que más aportó ese día. */
/* Ejercicios que solo aparecen en ese día de la semana — el bloque principal.
   Son los que de verdad identifican qué se entrenó: el calentamiento es igual los tres días. */
function idsPropios(n, di) {
  const dias = routineFor(n).dias;
  const otros = {};
  dias.forEach((d, i) => { if (i !== di) d.secciones.forEach(sx => sx.ejercicios.forEach(e => { otros[e.id] = 1; })); });
  const out = {};
  (dias[di] ? dias[di].secciones : []).forEach(sx => sx.ejercicios.forEach(e => { if (!otros[e.id]) out[e.id] = 1; }));
  return out;
}
function sesionesPlan(fromW, toW) {
  const porFecha = {};
  const tocar = f => porFecha[f] || (porFecha[f] = { fecha: f, regs: [], vistos: {}, cuenta: {}, dias: {} });
  for (let n = fromW; n <= toW; n++) {
    routineFor(n).dias.forEach((d, di) => {
      const dk = n + "-" + di;
      const propios = idsPropios(n, di);
      sesFechas(S.evals, dk).concat(sesFechas(S.dayNotes, dk)).forEach(f => {
        if (f === "s/f" || !enSemana(n, f)) return;
        const o = tocar(f);
        o.dias[dk] = { n, di, dia: d.nombre };
        o.cuenta[dk] = (o.cuenta[dk] || 0) + 1;
      });
      d.secciones.forEach(sx => sx.ejercicios.forEach(e => (S.logs[e.id] || []).forEach((l, li) => {
        if (!enSemana(n, l.fecha)) return;
        const o = tocar(l.fecha);
        o.dias[dk] = { n, di, dia: d.nombre };
        // solo los ejercicios propios del día deciden de qué día fue la sesión
        if (propios[e.id]) o.cuenta[dk] = (o.cuenta[dk] || 0) + (l.peso !== "✓" ? 5 : 2);
        const clave = e.id + "#" + li;
        if (!o.vistos[clave]) { o.vistos[clave] = 1; o.regs.push({ ex: e, log: l }); }
      })));
    });
  }
  return Object.keys(porFecha).sort((a, b) => fechaOrd(a) - fechaOrd(b)).map(f => {
    const o = porFecha[f];
    const dk = Object.keys(o.cuenta).sort((a, b) => o.cuenta[b] - o.cuenta[a])[0] || Object.keys(o.dias)[0];
    const info = o.dias[dk] || { n: fromW, di: 0, dia: "" };
    // la evaluación y la nota de esa fecha, la haya cargado el día que la haya cargado
    let ev = {}, nota = "";
    Object.keys(o.dias).forEach(k => {
      const e2 = S.evals[sesKey(k, f)];
      if (e2 && evalResumenTxt(e2) && !evalResumenTxt(ev)) ev = e2;
      const n2 = (S.dayNotes[sesKey(k, f)] || "").trim();
      if (n2 && !nota) nota = n2;
    });
    return { n: info.n, di: info.di, dk, fecha: f, dia: info.dia, ev, nota, regs: o.regs };
  });
}
/* Martín cambia el esquema entre semanas y eso genera un id nuevo para el mismo
   ejercicio: agrupado por id, "Landmine Press" son dos ejercicios distintos y la
   progresión real no se ve. Acá se agrupa por nombre. */
/* En un ejercicio asistido el peso es la AYUDA de la máquina: bajar de 44 a 40 kg es
   progresar, no retroceder. Sin esto el informe le muestra a Martín lo contrario. */
function esAsistido(exo) { return /asistid/i.test(String(exo && exo.nombre || "")); }
function cargasPorEjercicio(from, to) {
  const map = {};
  walkAll(exo => {
    if (exo.sinPeso) return;
    const dentro = (S.logs[exo.id] || []).filter(x => {
      if (num(x.peso) === null) return false;
      for (let n = from; n <= to; n++) if (enSemana(n, x.fecha)) return true;
      return false;
    });
    if (!dentro.length) return;
    const key = String(exo.nombre).trim().toLowerCase();
    const m = map[key] || (map[key] = { nombre: exo.nombre, esquemas: [], regs: [], inverso: esAsistido(exo) });
    if (exo.esquema && m.esquemas.indexOf(exo.esquema) < 0) m.esquemas.push(exo.esquema);
    m.regs = m.regs.concat(dentro);
  });
  return Object.keys(map).map(k => {
    const m = map[k];
    m.regs.sort((a, b) => fechaOrd(a.fecha) - fechaOrd(b.fecha));
    m.serie = bestPerDate(m.regs);
    m.fechas = [];
    m.regs.forEach(r => { if (m.fechas.indexOf(r.fecha) < 0) m.fechas.push(r.fecha); });
    m.pr = m.serie.length ? (m.inverso ? Math.min.apply(null, m.serie) : Math.max.apply(null, m.serie)) : null;
    const bruto = m.serie.length > 1 ? m.serie[m.serie.length - 1] - m.serie[0] : null;
    m.delta = bruto;
    m.mejora = bruto === null ? null : (m.inverso ? -bruto : bruto);   // signo "¿progresó?"
    m.pct = bruto !== null && m.serie[0] ? Math.round(100 * (m.inverso ? -bruto : bruto) / m.serie[0]) : null;
    return m;
  }).sort((a, b) => (b.serie.length - a.serie.length) || a.nombre.localeCompare(b.nombre, "es"));
}
function tonelajeSemana(n) {
  let t = 0;
  routineFor(n).dias.forEach(d => d.secciones.forEach(sx => sx.ejercicios.forEach(e => {
    const reps = repsDe(e) || 1;
    (S.logs[e.id] || []).forEach(l => {
      if (!enSemana(n, l.fecha)) return;
      const p = num(l.peso);
      if (p !== null) t += p * reps;
    });
  })));
  return Math.round(t);
}
function sesionesHechas(n) {
  return routineFor(n).dias.filter((d, di) => S.dayDone[n + "-" + di]).length;
}
/* Gráfico de línea con banda de corte — el de dolor 24h es el que gobierna el plan */
function lineChart(pts, o) {
  o = o || {};
  if (!pts.length) return "";
  const w = 320, h = 92, padL = 20, padR = 6, padT = 8, padB = 20;
  const max = o.max != null ? o.max : Math.max(...pts.map(p => p.v));
  const min = o.min != null ? o.min : 0;
  const span = (max - min) || 1;
  const X = i => padL + (pts.length === 1 ? (w - padL - padR) / 2 : i * (w - padL - padR) / (pts.length - 1));
  const Y = v => padT + (h - padT - padB) * (1 - (v - min) / span);
  const line = pts.map((p, i) => X(i).toFixed(1) + "," + Y(p.v).toFixed(1)).join(" ");
  const corte = o.corte != null ? `<line class="cut" x1="${padL}" x2="${w - padR}" y1="${Y(o.corte).toFixed(1)}" y2="${Y(o.corte).toFixed(1)}"/>
      <text class="cutx" x="${w - padR}" y="${(Y(o.corte) - 3).toFixed(1)}" text-anchor="end">${esc(o.corteTxt || "límite " + o.corte)}</text>` : "";
  const cada = Math.ceil(pts.length / 6);
  return `<svg class="linechart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="${esc(o.label || "")}">
    <line class="ax" x1="${padL}" x2="${w - padR}" y1="${Y(min).toFixed(1)}" y2="${Y(min).toFixed(1)}"/>
    ${corte}
    <polyline class="ln ${o.cls || ""}" points="${line}"/>
    ${pts.map((p, i) => `<circle class="dt ${o.corte != null && p.v >= o.corte ? "hot" : ""}" cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3"/>`).join("")}
    <text class="axn" x="2" y="${(Y(max) + 4).toFixed(1)}">${max}</text>
    <text class="axn" x="2" y="${(Y(min) + 4).toFixed(1)}">${min}</text>
    ${pts.map((p, i) => i % cada === 0 || i === pts.length - 1 ? `<text class="axd" x="${X(i).toFixed(1)}" y="${h - 5}" text-anchor="middle">${esc(p.f)}</text>` : "").join("")}
  </svg>`;
}
function barChart(rows, o) {
  o = o || {};
  const max = Math.max(1, ...rows.map(r => r.v));
  return `<div class="barchart">${rows.map(r => `<div class="brow">
    <span class="bl">${esc(r.l)}</span>
    <span class="bt"><span style="width:${Math.round(100 * r.v / max)}%" class="${r.v ? "" : "zero"}"></span></span>
    <span class="bv">${esc(o.fmt ? o.fmt(r.v, r) : String(r.v))}</span>
  </div>`).join("")}</div>`;
}

function textoInforme() {
  const from = INFORME.from, to = INFORME.to;
  const ses = sesionesPlan(from, to);
  let t = "INFORME DE ENTRENAMIENTO — Mauro Fernández para Prof. Martín Ferreras\n";
  t += (from === to ? "Semana " + from : "Semanas " + from + " a " + to) + " · emitido el " + hoy() + "\n\n";
  let hechas = 0, plan = 0;
  for (let n = from; n <= to; n++) { hechas += sesionesHechas(n); plan += routineFor(n).dias.length; }
  t += "ADHERENCIA: " + hechas + "/" + plan + " sesiones (" + (plan ? Math.round(100 * hechas / plan) : 0) + "%)\n";
  for (let n = from; n <= to; n++) t += "  Semana " + n + ": " + sesionesHechas(n) + "/3 · volumen " + tonelajeSemana(n).toLocaleString("es-AR") + " kg\n";
  const dolor = ses.filter(x => x.ev && x.ev.dolor24 != null);
  if (dolor.length) {
    const picos = dolor.filter(d => d.ev.dolor24 >= 4).length;
    t += "\nRODILLA (dolor 24 h): " + dolor.map(d => d.fecha + " " + d.ev.dolor24).join(" · ") + "\n";
    t += picos === 0 ? "  Ninguna sesión pasó de 4 — hay margen para progresar.\n"
      : "  " + picos + " sesión(es) por encima de 4 — mantener carga.\n";
  }
  const ejs = cargasPorEjercicio(from, to);
  if (ejs.length) {
    t += "\nPROGRESIÓN DE CARGAS\n";
    ejs.forEach(m => {
      t += "• " + m.nombre + " (" + (m.esquemas.join(" → ") || "—") + "): " +
        m.fechas.map(f => m.regs.filter(r => r.fecha === f).map(r => r.peso).join("/") + " el " + f).join(" → ") +
        (m.delta !== null ? "  [" + (m.delta > 0 ? "+" : "") + nfmt(m.delta) + " kg" + (m.pct !== null ? " · " + (m.pct > 0 ? "+" : "") + m.pct + "%" : "") +
          (m.inverso ? " de asistencia — menos es mejor" : "") + "]" : "") + "\n";
    });
  }
  t += "\nSESIÓN POR SESIÓN\n";
  ses.forEach(x => {
    t += "\n" + x.fecha + " " + diaSemanaDe(x.fecha) + " · Semana " + x.n + " · " + x.dia + (S.dayDone[x.dk] ? " ✓" : "") + "\n";
    const ev = evalResumenTxt(x.ev);
    if (ev) t += "  " + ev + "\n";
    if (x.nota) t += "  Nota: " + x.nota + "\n";
    const conP = x.regs.filter(r => r.log.peso !== "✓");
    if (conP.length) t += "  " + conP.map(r => r.ex.nombre + " " + r.log.peso).join(" · ") + "\n";
    const sinP = x.regs.filter(r => r.log.peso === "✓");
    if (sinP.length) t += "  Sin carga (" + sinP.length + "): " + sinP.map(r => r.ex.nombre).join(" · ") + "\n";
  });
  const bl = S.bodyLog.filter(b => num(b.peso) !== null);
  if (bl.length) t += "\nPESO CORPORAL: " + bl.map(b => b.peso + " el " + b.fecha).join(" → ") + "\n";
  const cs = S.comments.filter(c => !c.semana || (c.semana >= from && c.semana <= to));
  if (cs.length) { t += "\nCOMENTARIOS\n"; cs.forEach(c => { t += "• [" + c.quien + " · " + c.fecha + "] " + c.texto + "\n"; }); }
  return t;
}

/* ================= LINK COMPARTIBLE =================
   El informe viaja entero dentro de la URL: el que lo abre corre la misma app, con el
   mismo plan de Martín, así que solo hace falta mandar lo registrado. Sin servidor ni
   base de datos, y los datos de quien lo abre no se tocan. */
function b64url(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function deB64url(str) {
  const b = str.replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(b + "===".slice((b.length + 3) % 4));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function empaquetar(from, to) {
  const L = {};
  Object.keys(S.logs || {}).forEach(id => {
    const arr = (S.logs[id] || []).map(l => {
      const a = [l.fecha, l.peso, l.esf || "", l.nota || ""];
      while (a.length > 2 && !a[a.length - 1]) a.pop();
      return a;
    });
    if (arr.length) L[id] = arr;
  });
  // las rutinas solo viajan si Mauro editó el plan; si no, el receptor las arma del plan original
  const R = {};
  Object.keys(S.routines || {}).forEach(n => {
    const seed = SEED.semanas[n - 1];
    if (seed && seed.dias && JSON.stringify(S.routines[n].dias) !== JSON.stringify(seed.dias)) R[n] = S.routines[n];
  });
  const d = { v: 1, f: from, t: to, L, E: S.evals, N: S.dayNotes, D: S.dayDone,
    W: S.weekDone, C: S.comments, B: S.bodyLog, P: S.compPick };
  if (Object.keys(R).length) d.R = R;
  return d;
}
async function comprimir(obj) {
  const json = JSON.stringify(obj);
  if (typeof CompressionStream === "function") {
    const st = new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"));
    const buf = await new Response(st).arrayBuffer();
    return "1" + b64url(new Uint8Array(buf));
  }
  return "0" + b64url(new TextEncoder().encode(json));
}
async function descomprimir(str) {
  const modo = str.charAt(0), bytes = deB64url(str.slice(1));
  if (modo === "1") {
    const st = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    return JSON.parse(await new Response(st).text());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
function aplicarCompartido(d) {
  READONLY = true;
  S = freshState();
  S.logs = {};
  Object.keys(d.L || {}).forEach(id => {
    S.logs[id] = d.L[id].map(a => ({ fecha: a[0], peso: a[1], esf: a[2] || "", nota: a[3] || "" }));
  });
  S.evals = d.E || {}; S.dayNotes = d.N || {}; S.dayDone = d.D || {};
  S.weekDone = d.W || {}; S.comments = d.C || []; S.bodyLog = d.B || [];
  S.compPick = d.P || {}; S.routines = d.R || {};
  EXCACHE = null;
}
/* Link de importación: trae un backup entero dentro de la URL y lo carga previa
   confirmación. Sirve para mudar de dispositivo sin archivos y para que yo te pase
   datos corregidos de un toque. A diferencia de #r=, este SÍ escribe. */
window.copiarLinkImport = async () => {
  const m = $("#expmsg");
  if (m) m.textContent = "Armando el link…";
  try {
